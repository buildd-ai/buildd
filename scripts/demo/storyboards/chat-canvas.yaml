# The chat canvas (docs/design/chat-canvas.md) on the multi-currency story:
# the chat page as the canvas, the canvas summoned over the Board and a task,
# and the phone takeover.
#
#   bun run demo:shoot scripts/demo/storyboards/chat-canvas.yaml --out <dir>
story: ../stories/multi-currency.json
name: chat-canvas
viewport: { width: 1440, height: 900, scale: 2 }
viewports: { phone: { width: 390, height: 844, scale: 3 } }
themes: [dark, light]
highlight:
  - chat-column
  - canvas-pinned
  - canvas-ask
  - ask-about-mission
  - chat-canvas-overlay
  - approval-card
steps:
  - id: k0-chat-propose
    goto: /app/chat/{C1}
    viewports: [desktop, phone]
    waitFor: approval-card
    scrollTo: approval-confirm
    scrollAlign: end
    caption: "The conversation is soft; the approval stays a hard card."

  - id: k1-chat-new
    goto: /app/chat
    viewports: [desktop, phone]
    waitFor: canvas-empty
    caption: "A plain greeting and questions you can tap."

  # w8 waits on Maya from 14:28 to 16:54 (pinned by multi-currency-story.test.ts),
  # so the empty canvas reads NEEDS YOU with the copper row and rule.
  - id: k1b-chat-new-needs-you
    advance: "14:30"
    goto: /app/chat
    viewports: [phone]
    waitFor: canvas-empty
    caption: "Something waits on you: the canvas says so, in copper."

  - id: k1c-chat-new-reduced-motion
    advance: "14:30"
    goto: /app/chat
    viewports: [phone]
    waitFor: canvas-empty
    reducedMotion: true
    caption: "Reduced motion: still pools, no sweep."

  - id: k2-chat-filed
    advance: "1:00"
    goto: /app/chat/{C1}
    waitFor: [chat-dock, object-card]
    caption: "The mission docks beside the chat."

  - id: k3-chat-filed-phone
    advance: "1:00"
    goto: /app/chat/{C1}
    viewports: [phone]
    waitFor: canvas-pinned
    caption: "On the phone the live mission pins at the top."

  - id: k4-board-ask
    advance: "12:40"
    goto: /app/missions/{M1}
    waitFor: canvas-ask
    caption: "Ask floats on every desktop page; a phone keeps its Chat tab."

  - id: k5-board-summoned
    advance: "12:40"
    goto: /app/missions/{M1}
    waitFor: canvas-ask
    click: canvas-ask
    hold: 4000
    caption: "Summoned over the Board, about the Board: a peek."

  # A phone has no floating button: the mission's own Ask opens the canvas,
  # and it takes over the screen.
  - id: k5-board-summoned-phone
    advance: "12:40"
    goto: /app/missions/{M1}
    viewports: [phone]
    waitFor: ask-about-mission
    click: ask-about-mission
    hold: 4000
    caption: "On a phone the canvas takes over the screen."

  - id: k6-task-summoned
    advance: "12:40"
    goto: /app/tasks/{T7}
    waitFor: canvas-ask
    click: canvas-ask
    hold: 4000
    caption: "Over a task, about the task."

  - id: k7-task-question
    advance: "14:35"
    goto: /app/tasks/{T8}
    viewports: [desktop, phone]
    waitFor: worker-question-hero
    caption: "The question hero: plain choices, no keycaps."
