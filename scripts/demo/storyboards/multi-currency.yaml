# Key beats of the "one sentence -> a fleet ships it" demo.
# Keys in {braces} are dataset keys from the story JSON (M1 = the mission, T8 = checkout task, ...).
# Run:  DEMO_STORY=<story-data.json> bun run scripts/demo/run-storyboard.ts scripts/demo/storyboards/multi-currency.yaml
story: ../stories/placeholder.json
name: multi-currency
viewport: { width: 1440, height: 900, scale: 2 }
themes: [dark, light]
steps:
  - id: 01-home-fanout
    advance: "2:20"
    goto: /app/home
    waitFor: home-right-now
    highlight: [home-right-now, task-card]
    caption: "Twelve tasks. Three phases. Dependencies worked out for you."

  - id: 02-mission-fanout
    goto: /app/missions/{M1}
    waitFor: mission-board
    highlight: [mission-band, board-column, board-tile]
    caption: "Five agents, four machines, the same minute."

  - id: 03-missions-list
    advance: "11:50"
    goto: /app/missions
    waitFor: mission-card
    highlight: [mission-card]
    caption: "Six agents. Four machines. At the same time."

  - id: 04-mission-peak
    goto: /app/missions/{M1}
    waitFor: mission-board
    highlight: [fleet-band, board-tile]
    caption: "Six agents. Four machines. At the same time."
    # Live take: the page stays open while the timeline advances; updates arrive over soketi.
    record: { ms: 8000, advanceTo: "12:30", ticks: 8 }

  - id: 05-task-live-activity
    advance: "12:40"
    goto: /app/tasks/{T7}
    waitFor: worker-now-strip
    highlight: [worker-current-action, worker-progress-bar, worker-step-rail, worker-stats, worker-activity-timeline, worker-touched]
    caption: "Every agent narrates what it's doing."

  - id: 06-waiting-input
    advance: "14:35"
    goto: /app/tasks/{T8}
    waitFor: worker-needs-input-banner
    highlight: [global-needs-input-banner, worker-needs-input-banner, worker-needs-input-options]
    caption: "When it matters, they ask."

  - id: 07-waiting-input-banner
    goto: /app/tasks/{T8}
    waitFor: worker-needs-input-banner
    highlight: [worker-needs-input-options, worker-paused-bar, task-while-you-decide]
    caption: "The other five keep working."

  - id: 07b-mission-needs-you
    goto: /app/missions/{M1}
    waitFor: needs-you-band
    highlight: [needs-you-band, needs-you-cell, board-answer-options]
    caption: "The question and its answers, right on the mission."

  - id: 08-home-waiting-on-you
    goto: /app/home
    waitFor: home-waiting-on-you
    highlight: [home-waiting-on-you, home-right-now]
    caption: "You answer from wherever you are."

  - id: 09-ci-failure
    advance: "18:40"
    goto: /app/missions/{M1}?layout=lanes
    waitFor: mission-lanes
    highlight: [mission-lanes-chart, lane-bar, lanes-in-review]
    caption: "CI broke. Nobody noticed."

  - id: 10-activity
    advance: "21:45"
    goto: /app/tasks
    waitFor: task-card
    highlight: [task-card]
    caption: "It's fixed. And background work keeps ticking."

  - id: 10b-task-landed
    advance: "22:30"
    goto: /app/tasks/{T7}
    waitFor: pr-outcome
    highlight: [pr-outcome, pr-diff-bar, pr-lineage, pr-commit-checks]
    caption: "Red, retried, green, merged. Nobody touched it."

  - id: 11-criteria-going-green
    advance: "34:05"
    goto: /app/missions/{M1}
    waitFor: mission-board
    highlight: [goal-band, goal-criterion]
    caption: "Done means done: your criteria, verified."

  - id: 12-mission-complete
    advance: end
    goto: /app/missions/{M1}
    waitFor: mission-board
    highlight: [mission-completion-record, goal-band, mission-concurrency]
    caption: "37 minutes."

  - id: 13-missions-list-complete
    goto: /app/missions
    waitFor: mission-card
    highlight: [mission-card]
    caption: "It joins the missions you already shipped."

  - id: 14-home-after
    goto: /app/home
    waitFor: home-activity
    highlight: [home-activity, home-missions]
    caption: "11 PRs merged. 1 CI failure fixed automatically. 1 decision from a human."
