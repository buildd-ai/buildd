<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat v3, desktop frames</title>
<!-- Design mockup only. Fictional data. See docs/design/chat-v3-desktop.md. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #141312; --bar: #171513; --surface: #1f1c19; --raised: #2a2622;
    --rule: #37322c; --rule-strong: #8a8378;
    --text: #efe8dc; --muted: #a89f92; --dim: #8b8276;
    --calm: #8fb9b3; --needs: #e0955a; --send: #c9783b; --on-send: #171513;
    --think: #7ea6ff; --think-2: #b49cff; --landed: #86c9a1;
    --scrim: rgba(14, 13, 12, .74);
    --serif: 'Newsreader', Georgia, serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0b0a09; color: var(--text); font-family: var(--mono); padding: 48px; }
  .sheet-title { font: 600 13px/1 var(--mono); letter-spacing: .16em; color: var(--muted); margin-bottom: 8px; }
  .sheet-note { font: 400 13px/1.5 var(--mono); color: var(--dim); max-width: 1000px; margin-bottom: 48px; }
  figure { margin-bottom: 72px; }
  figcaption { font: 500 12px/1 var(--mono); letter-spacing: .14em; color: var(--muted); margin-bottom: 14px; text-transform: uppercase; }
  figcaption b { color: var(--text); font-weight: 600; margin-right: 12px; }

  /* ---------- frame ---------- */
  .frame { width: 1440px; height: 900px; position: relative; overflow: hidden; background: var(--ground);
           display: grid; grid-template-columns: 56px 1fr; }
  .frame.dock { grid-template-columns: 56px 1fr 420px; }

  /* ---------- rail (existing 56px icon rail, restyled only in colour) ---------- */
  .rail { background: var(--bar); border-right: 1px solid var(--rule); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 6px; z-index: 3; }
  .rail .team { width: 36px; height: 36px; border: 1.5px solid var(--needs); color: var(--needs); font: 600 13px/33px var(--mono); text-align: center; margin-bottom: 14px; }
  .rail .ico { width: 40px; height: 40px; display: grid; place-items: center; color: var(--dim); }
  .rail .ico.on { color: var(--needs); box-shadow: inset 2px 0 0 var(--needs); }
  .rail .ico svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: square; }
  .rail .grow { flex: 1; }
  .rail .avatar { width: 32px; height: 32px; background: var(--raised); border: 1px solid var(--rule); color: var(--needs); font: 600 12px/30px var(--mono); text-align: center; }

  /* ---------- stage + sea ---------- */
  .stage { position: relative; overflow: hidden; min-width: 0; }
  .sea { position: absolute; inset: -60px; pointer-events: none; z-index: 0; transition: opacity .8s; }
  .pool { position: absolute; border-radius: 50%; filter: blur(28px); will-change: transform;
          animation: drift var(--t, 40s) ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(var(--dx, 32px), var(--dy, -28px)); } }
  .p-teal  { background: radial-gradient(closest-side, rgba(70,122,124,.55), transparent); }
  .p-navy  { background: radial-gradient(closest-side, rgba(44,78,100,.6), transparent); }
  .p-sage  { background: radial-gradient(closest-side, rgba(98,130,114,.35), transparent); }
  .p-deep  { background: radial-gradient(closest-side, rgba(28,46,60,.7), transparent); }
  .p-copper{ background: radial-gradient(closest-side, rgba(224,149,90,.38), transparent); }
  .p-blue  { background: radial-gradient(closest-side, rgba(126,166,255,.45), transparent); }
  .p-violet{ background: radial-gradient(closest-side, rgba(180,156,255,.4), transparent); }
  .p-tealt { background: radial-gradient(closest-side, rgba(64,112,114,.4), transparent); }
  .p-ink   { background: radial-gradient(closest-side, rgba(30,40,82,.7), transparent); }

  /* ---------- top bar ---------- */
  .topbar { position: relative; z-index: 2; height: 56px; display: flex; align-items: center; padding: 0 28px;
            background: rgba(23,21,19,.92); border-bottom: 1px solid var(--rule); gap: 12px; }
  .crumb { font: 700 13px/1 var(--mono); letter-spacing: .14em; }
  .crumb-sub { font: 400 13px/1 var(--mono); color: var(--muted); }
  .topbar .sp { flex: 1; }
  .tlink { font: 500 12px/1 var(--mono); letter-spacing: .14em; color: var(--muted); }
  .back { font: 400 20px/1 var(--mono); color: var(--muted); margin-right: 4px; }
  .ttitle { font: 400 22px/1 var(--serif); }

  /* ---------- the column ---------- */
  .col { position: absolute; z-index: 1; top: 56px; bottom: 0; left: 50%; width: 720px; margin-left: -360px;
         display: flex; flex-direction: column; padding-bottom: 28px; }
  .hero { padding-top: 104px; }
  .over { display: flex; align-items: center; gap: 12px; font: 500 11px/1 var(--mono); letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }
  .dot { width: 8px; height: 8px; background: var(--calm); animation: pulse 2.4s ease-in-out infinite; }
  .dot.needs { background: var(--needs); }
  @keyframes pulse { 50% { opacity: .35; } }
  h1 { font: 400 64px/1.02 var(--serif); letter-spacing: -.02em; margin-top: 18px; }
  .sub { font: italic 400 24px/1.35 var(--serif); color: var(--muted); margin-top: 16px; max-width: 600px; }
  .flex1 { flex: 1; }

  /* PICKED FOR YOU */
  .picked { background: rgba(20,19,18,.78); border: 1px solid var(--rule); margin-bottom: 24px; }
  .picked .hd { height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
                border-bottom: 1px solid var(--rule); font: 500 10.5px/1 var(--mono); letter-spacing: .16em; color: var(--muted); }
  .picked .hd .st { letter-spacing: .08em; text-transform: none; }
  .row { height: 56px; display: flex; align-items: center; gap: 18px; padding: 0 18px; border-bottom: 1px solid var(--rule); }
  .row:last-child { border-bottom: 0; }
  .row .n { font: 500 11px/1 var(--mono); color: var(--dim); width: 18px; }
  .row .t { font: 400 20px/1 var(--serif); flex: 1; }
  .row .a { font: 400 16px/1 var(--mono); color: var(--muted); }
  .row.copper .t, .row.copper .a, .row.copper .n { color: var(--needs); }
  .row.hover { background: rgba(239,232,220,.04); }

  /* composer */
  .composer { position: relative; background: var(--surface); border: 1px solid var(--rule); border-top: 2px solid var(--rule-strong);
              box-shadow: 4px 4px 0 0 var(--rule); }
  .composer.needs { border-top-color: var(--needs); }
  .composer.think { border-top-color: #34405e; }
  .composer .input { min-height: 76px; padding: 16px 20px; font: 400 19px/1.35 var(--serif); color: var(--dim); }
  .composer .tools { height: 48px; display: flex; border-top: 1px solid var(--rule); }
  .cell { display: flex; align-items: center; justify-content: center; gap: 8px; border-left: 1px solid var(--rule); font: 500 13px/1 var(--mono); color: var(--text); }
  .cell:first-child { border-left: 0; }
  .cell.scope { flex: 1; justify-content: flex-start; padding: 0 16px; }
  .cell.scope .at { color: var(--needs); }
  .cell.tool { width: 64px; color: var(--needs); }
  .cell.tier { width: 88px; }
  .cell.send { width: 64px; background: var(--send); color: var(--on-send); font-size: 20px; font-weight: 600; border-left: 0; }
  .cell.stop { width: 64px; background: var(--text); border-left: 0; }
  .cell.stop i { width: 12px; height: 12px; background: var(--bar); display: block; }
  .caret { color: var(--dim); font-size: 10px; }
  .lock { width: 12px; height: 12px; border: 1.5px solid var(--muted); position: relative; top: 2px; }
  .lock::before { content: ''; position: absolute; width: 6px; height: 5px; border: 1.5px solid var(--muted); border-bottom: 0; left: 1.5px; top: -6px; }
  /* THE ONLY GLOW: sweeps the composer top edge while busy */
  .sweep { position: absolute; top: -2px; left: 0; right: 0; height: 2px; overflow: visible; clip-path: inset(-14px 0 -14px 0); }
  .sweep::after { content: ''; position: absolute; top: 0; left: -140px; width: 140px; height: 2px; background: var(--think);
                  box-shadow: 0 0 12px var(--think); animation: sweep 1.8s linear infinite; }
  @keyframes sweep { to { left: 100%; } }

  /* thread */
  .thread { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 24px; gap: 0; }
  .me { align-self: flex-end; max-width: 82%; background: var(--raised); border: 1px solid var(--rule-strong); box-shadow: 3px 3px 0 0 var(--rule);
        padding: 16px 20px; font: 400 18px/1.4 var(--serif); }
  .route { align-self: flex-end; font: 400 10.5px/1 var(--mono); letter-spacing: .08em; color: var(--dim); margin: 10px 2px 22px; }
  .said { font: 400 18px/1.5 var(--serif); color: var(--muted); max-width: 640px; margin-bottom: 14px; }
  .landed-chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--landed); color: var(--landed);
                 font: 600 10.5px/1 var(--mono); letter-spacing: .12em; padding: 6px 8px; margin-bottom: 30px; }
  .landed-chip i { width: 7px; height: 7px; background: var(--landed); }
  .bblock { background: rgba(20,19,18,.8); border: 1px solid var(--rule); box-shadow: inset 2px 0 0 #5f7fd0; padding: 18px 24px 20px 26px; }
  .bhd { display: flex; align-items: center; gap: 14px; font: 700 11px/1 var(--mono); letter-spacing: .16em; }
  .bhd .who { color: var(--needs); } .bhd .st { color: #9ec0ff; }
  .ticks { display: flex; gap: 3px; } .ticks i { width: 4px; height: 4px; background: #9ec0ff; animation: pulse 1.2s infinite; }
  .ticks i:nth-child(2) { animation-delay: .2s; } .ticks i:nth-child(3) { animation-delay: .4s; }
  .steps { list-style: none; margin: 16px 0 16px; display: grid; gap: 10px; }
  .steps li { display: flex; align-items: center; gap: 12px; font: 400 13.5px/1 var(--mono); }
  .steps li i { width: 10px; height: 10px; display: block; }
  .steps .done { color: var(--dim); } .steps .done i { background: #4a5a7a; }
  .steps .now { color: #dfe8ff; } .steps .now i { background: var(--think); animation: pulse 1.4s infinite; }
  .steps .todo { color: #6f675d; } .steps .todo i { border: 1px solid #6f675d; }
  .prose { font: 400 18px/1.5 var(--serif); max-width: 640px; }
  .bcaret { display: inline-block; width: 9px; height: 20px; background: var(--think); vertical-align: -3px; margin-left: 2px; }

  /* ---------- dock (a fleet object beside the chat) ---------- */
  .dockp { position: relative; z-index: 2; background: var(--bar); border-left: 1px solid var(--rule-strong); display: flex; flex-direction: column; }
  .dhd { height: 56px; display: flex; align-items: center; border-bottom: 1px solid var(--rule); }
  .dhd .l { flex: 1; padding: 0 20px; font: 500 11px/1 var(--mono); letter-spacing: .16em; color: var(--muted); }
  .dhd .l b { color: var(--text); font-weight: 600; }
  .dhd .b { height: 56px; padding: 0 16px; display: flex; align-items: center; border-left: 1px solid var(--rule); font: 500 11px/1 var(--mono); letter-spacing: .14em; color: var(--muted); }
  .dhd .x { width: 56px; justify-content: center; font-size: 16px; color: var(--text); }
  .dbody { padding: 24px 20px; display: flex; flex-direction: column; gap: 22px; overflow: hidden; }
  .obj { background: var(--surface); border: 1px solid var(--rule-strong); box-shadow: 4px 4px 0 0 var(--rule); }
  .obj.needs { border-top: 2px solid var(--needs); }
  .obj .top { padding: 16px 18px 14px; }
  .lab { display: flex; justify-content: space-between; align-items: center; font: 500 10.5px/1 var(--mono); letter-spacing: .16em; color: var(--muted); }
  .badge { font: 600 10px/1 var(--mono); letter-spacing: .12em; padding: 5px 7px; border: 1px solid; }
  .badge.copper { color: var(--needs); } .badge.green { color: var(--landed); } .badge.blue { color: #9ec0ff; }
  .otitle { font: 400 23px/1.2 var(--serif); margin-top: 12px; }
  .strip { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--rule); }
  .strip > div { padding: 12px 18px 14px; }
  .strip > div + div { border-left: 1px solid var(--rule); }
  .strip .k { display: flex; justify-content: space-between; font: 500 10.5px/1 var(--mono); letter-spacing: .14em; color: var(--muted); }
  .strip .k b { color: var(--text); font-weight: 500; }
  .segs { display: flex; gap: 3px; margin-top: 10px; } .segs i { flex: 1; height: 7px; border: 1px solid #4a453e; }
  .segs i.g { background: var(--landed); border-color: var(--landed); }
  .segs i.b { background: var(--think); border-color: var(--think); }
  .segs i.c { border-color: var(--needs); }
  .segs i.cf { border-color: var(--needs); background: var(--needs); }
  .insight { border-top: 1px solid var(--rule); padding: 13px 18px; font: italic 400 17px/1.35 var(--serif); color: var(--muted); display: flex; gap: 10px; align-items: baseline; }
  .insight i { width: 8px; height: 8px; background: var(--needs); flex: none; position: relative; top: -1px; }
  .sec { font: 500 10.5px/1 var(--mono); letter-spacing: .16em; color: var(--muted); margin-bottom: 10px; }
  .log { border: 1px solid var(--rule); }
  .log div { display: flex; gap: 14px; padding: 11px 14px; border-bottom: 1px solid var(--rule); font: 400 12.5px/1.35 var(--mono); color: var(--muted); }
  .log div:last-child { border-bottom: 0; }
  .log span { color: var(--dim); width: 40px; flex: none; }
  .log .c { color: var(--needs); }
  .btns { display: flex; gap: 10px; }
  .btn { height: 44px; padding: 0 16px; display: inline-flex; align-items: center; font: 500 13px/1 var(--mono); border: 1px solid var(--rule-strong); color: var(--text); background: transparent; }
  .btn.pri { background: var(--send); border-color: var(--send); color: var(--on-send); font-weight: 600; }
  .agents { border: 1px solid var(--rule); }
  .agents div { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--rule); font: 400 12.5px/1 var(--mono); color: var(--muted); }
  .agents div:last-child { border-bottom: 0; }
  .agents i { width: 8px; height: 8px; flex: none; }
  .agents .r { margin-left: auto; color: var(--dim); }

  /* ---------- mission page behind the peek ---------- */
  .page { position: relative; padding: 28px 44px; font-family: var(--mono); }
  .page .ph { display: flex; align-items: center; gap: 16px; }
  .page .ph .bk { color: var(--dim); font-size: 14px; }
  .page .ph h2 { font: 600 28px/1 var(--mono); }
  .page .desc { font: 400 14px/1 var(--mono); color: var(--muted); margin-top: 18px; }
  .page .box { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--rule-strong); margin-top: 26px; width: 1000px; box-shadow: 5px 5px 0 0 #000; }
  .page .box > div { padding: 18px 22px; height: 150px; }
  .page .box > div + div { border-left: 1px solid var(--rule); }
  .page .big { font: 600 40px/1 var(--mono); margin-top: 14px; }
  .page .cols { display: grid; grid-template-columns: repeat(3, 320px); gap: 20px; margin-top: 30px; }
  .page .card { border: 2px solid var(--rule-strong); border-left: 5px solid var(--landed); padding: 14px 16px; height: 86px; margin-top: 12px; background: #1d1b18; }
  .page .card b { font: 600 15px/1 var(--mono); display: block; }
  .page .card span { font: 400 12.5px/1 var(--mono); color: var(--muted); display: block; margin-top: 14px; }
  .page .ch { font: 600 12px/1 var(--mono); letter-spacing: .16em; color: var(--muted); }
  .scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 4; }
  .peek { position: absolute; z-index: 5; top: 16px; bottom: 16px; right: 16px; width: 600px; background: var(--bar);
          border: 1px solid var(--rule-strong); border-top: 2px solid var(--rule-strong); box-shadow: 5px 5px 0 0 #000;
          display: flex; flex-direction: column; }
  .peek .dbody { flex: 1; padding: 24px 24px; }
  .peek .composer { margin: 0 24px 24px; }

  @media (prefers-reduced-motion: reduce) {
    .pool, .dot, .ticks i, .steps .now i { animation: none; }
    .sweep::after { animation: none; left: 0; width: 100%; box-shadow: none; }
  }
</style>
</head>
<body>

<div class="sheet-title">BUILDD / CHAT V3 / DESKTOP 1440 X 900</div>
<p class="sheet-note">Four frames for review, drawn from the approved mobile v3. Fictional data. Grid: 56 rail, a stage that holds the sea and a 720 column, and an optional 420 dock for the object the chat is about. The peek is 600 wide over a dimmed page.</p>

<!-- ===================================================== A. CALM -->
<figure>
<figcaption><b>A</b>/app/chat, calm</figcaption>
<div class="frame" id="calm">
  <nav class="rail">
    <div class="team">N</div>
    <div class="ico"><svg viewBox="0 0 20 20"><path d="M3 9l7-6 7 6v8H3z"/></svg></div>
    <div class="ico on"><svg viewBox="0 0 20 20"><path d="M3 3h14v10H8l-5 4z"/></svg></div>
    <div class="ico"><svg viewBox="0 0 20 20"><path d="M3 5h14M3 10h10M3 15h7"/></svg></div>
    <div class="ico"><svg viewBox="0 0 20 20"><path d="M10 3v14M3 10h14"/><rect x="4" y="4" width="12" height="12"/></svg></div>
    <div class="ico"><svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14"/><rect x="7" y="7" width="6" height="6"/></svg></div>
    <div class="ico"><svg viewBox="0 0 20 20"><path d="M3 10h4l2-5 3 10 2-5h3"/></svg></div>
    <div class="ico"><svg viewBox="0 0 20 20"><rect x="3" y="4" width="6" height="6"/><rect x="11" y="4" width="6" height="6"/><path d="M3 16h14"/></svg></div>
    <div class="ico"><svg viewBox="0 0 20 20"><path d="M3 11h3l2-6 4 10 2-4h3"/></svg></div>
    <div class="grow"></div>
    <div class="ico"><svg viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2"/></svg></div>
    <div class="avatar">R</div>
  </nav>
  <main class="stage">
    <div class="sea">
      <div class="pool p-teal"  style="left:120px;top:40px;width:520px;height:460px;--t:44s;--dx:40px;--dy:30px"></div>
      <div class="pool p-navy"  style="left:560px;top:260px;width:560px;height:520px;--t:52s;--dx:-36px;--dy:24px"></div>
      <div class="pool p-deep"  style="left:-80px;top:420px;width:480px;height:480px;--t:38s;--dx:30px;--dy:-40px"></div>
      <div class="pool p-sage"  style="left:980px;top:60px;width:420px;height:380px;--t:47s;--dx:-28px;--dy:36px"></div>
      <div class="pool p-navy"  style="left:900px;top:640px;width:460px;height:380px;--t:33s;--dx:24px;--dy:-30px"></div>
      <div class="pool p-teal"  style="left:360px;top:680px;width:420px;height:340px;--t:41s;--dx:-40px;--dy:-20px;opacity:.7"></div>
      <div class="pool p-deep"  style="left:1180px;top:340px;width:360px;height:360px;--t:29s;--dx:-32px;--dy:28px"></div>
      <div class="pool p-sage"  style="left:40px;top:-40px;width:320px;height:300px;--t:36s;--dx:36px;--dy:34px;opacity:.8"></div>
      <div class="pool p-deep"  style="left:620px;top:-60px;width:380px;height:320px;--t:50s;--dx:-24px;--dy:40px"></div>
    </div>
    <header class="topbar"><span class="crumb">CHAT</span><span class="crumb-sub">/ new</span><span class="sp"></span><span class="tlink">HISTORY →</span></header>
    <div class="col">
      <div class="hero">
        <div class="over"><span class="dot"></span>Sun 27 Sep · Calm</div>
        <h1>All quiet.</h1>
        <p class="sub">Nothing is waiting on you. A good morning to start something.</p>
      </div>
      <div class="flex1"></div>
      <div class="picked">
        <div class="hd"><span>PICKED FOR YOU</span><span class="st">nothing blocked</span></div>
        <div class="row hover"><span class="n">01</span><span class="t">Recap the week</span><span class="a">→</span></div>
        <div class="row"><span class="n">02</span><span class="t">Plan Monday</span><span class="a">→</span></div>
      </div>
      <div class="composer">
        <div class="input">Recap the week</div>
        <div class="tools">
          <div class="cell scope"><span class="at">@</span> all <span class="caret">▾</span></div>
          <div class="cell tool">··· 2</div>
          <div class="cell tier">auto <span class="caret">▾</span></div>
          <div class="cell send">↑</div>
        </div>
      </div>
    </div>
  </main>
</div>
</figure>

<!-- ===================================================== B. NEEDS YOU -->
<figure>
<figcaption><b>B</b>/app/chat, needs you. The blocked thing docks on the right.</figcaption>
<div class="frame dock" id="needs">
  <nav class="rail">
    <div class="team">N</div>
    <div class="ico"><svg viewBox="0 0 20 20"><path d="M3 9l7-6 7 6v8H3z"/></svg></div>
    <div class="ico on"><svg viewBox="0 0 20 20"><path d="M3 3h14v10H8l-5 4z"/></svg></div>
