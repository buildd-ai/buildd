# Private Prompt Eval: the decision benchmarks, run against the prompt text the
# production deployment actually runs.
#
# Public CI only ever exercises the public prompt defaults compiled into this
# repo. Production replaces them from a private prompts repo (docs/prompts.md):
# vars.PROMPTS_REPO_NAME when set, else `<this repo's name>-prompts` under the
# same owner, derived so the name is never committed here. This job checks that repo out, installs its prompts as
# the text in effect, and scores every decision benchmark set that has
# labelled cases in its `evals/` directory (scripts/private-prompt-eval.ts).
# The job summary lists each prompt id with the version and content hash that
# was scored, next to its scores.
#
# Logs here are world-readable. The script never prints prompt text or case
# content, and checks every byte of its report against the loaded prompt
# bodies before writing it; a match fails the job instead of publishing.
#
# Credentials, and why a missing one is red:
#   - reading the private repo: secrets.PROMPTS_REPO_TOKEN (contents:read on
#     the prompts repo), else a token from the release GitHub App
#     (vars.RELEASE_APP_ID + secrets.RELEASE_APP_PRIVATE_KEY) if it is
#     installed on that repo;
#   - the decision calls: secrets.OPENROUTER_API_KEY.
# With either missing the job FAILS and names the secret, like the no-prod-data
# gate does without NO_PROD_DATA_IDENTIFIERS: a green run over the public
# defaults would measure nothing while looking like a pass. A manual dispatch
# with dry_run=true needs only the repo credential (no model calls).
name: Private Prompt Eval

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Load and fingerprint the private prompts and count cases; make no model calls'
        type: boolean
        default: false
      ref:
        description: 'Branch, tag or sha of the prompts repo to score'
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: private-prompt-eval
  cancel-in-progress: false

jobs:
  eval:
    name: Score decision prompts (private text)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # github.event.repository is absent on some events, so derive the name from GITHUB_REPOSITORY.
      - name: Name the prompts repo
        env:
          OVERRIDE: ${{ vars.PROMPTS_REPO_NAME }}
        run: echo "PROMPTS_REPO_NAME=${OVERRIDE:-${GITHUB_REPOSITORY#*/}-prompts}" >> "$GITHUB_ENV"

      - name: Mint a read token for the prompts repo (release GitHub App)
        id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.PROMPTS_REPO_NAME }}

      - name: Require a credential for the prompts repo
        env:
          HAS_PAT: ${{ secrets.PROMPTS_REPO_TOKEN != '' }}
          HAS_APP: ${{ steps.app-token.outputs.token != '' }}
        run: |
          if [ "$HAS_PAT" = "true" ]; then echo "Reading the prompts repo with PROMPTS_REPO_TOKEN."; exit 0; fi
          if [ "$HAS_APP" = "true" ]; then echo "Reading the prompts repo with the release GitHub App."; exit 0; fi
          echo "::error::No credential can read the private prompts repo. Set the repo secret PROMPTS_REPO_TOKEN (a token with contents:read on that repo), or install the release GitHub App (vars.RELEASE_APP_ID + secrets.RELEASE_APP_PRIVATE_KEY) on it. Refusing to pass on the public defaults."
          exit 1

      - name: Check out the private prompts
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/${{ env.PROMPTS_REPO_NAME }}
          ref: ${{ inputs.ref || 'main' }}
          path: .private-prompts
          token: ${{ secrets.PROMPTS_REPO_TOKEN || steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Score
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          args=(--prompts .private-prompts --require)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          bun run scripts/private-prompt-eval.ts "${args[@]}"
