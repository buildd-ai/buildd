name: Release

# Two release flows live here, and the repo variable RELEASE_CANDIDATE_CUT picks
# one. Flipping it is the cutover; flipping it back is the rollback.
#
#   unset / anything else  → legacy: promote CHANGELOG on dev, then the org's
#                            reusable workflow bumps versions ON dev and opens or
#                            updates the dev → main PR (whose head moves with dev).
#   "enabled"              → frozen candidates: scripts/release-candidate.ts cuts
#                            release/vX.Y.Z from ONE captured dev SHA, puts the
#                            version + CHANGELOG commit only on that branch, and
#                            opens release/vX.Y.Z → main. dev is never written to.
#
# A `dry_run` dispatch always takes the candidate path and changes nothing, so the
# new flow can be rehearsed before the variable is flipped.
#
# The captured SHA is `github.sha`: the dev head when this run was triggered. A
# re-run of the same run reuses it, so a re-run cannot pick up a dev that moved.
# Local `bun run release` dispatches this same workflow; `bun run
# release:candidate -- cut --dry-run --source origin/dev` runs the same engine
# from a workstation.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Cut even if there are no feat/fix commits since the last tag'
        required: false
        default: 'false'
      dry_run:
        description: 'Candidate flow only: compute and print the candidate, push and open nothing'
        required: false
        default: 'false'
      amend:
        description: 'Candidate flow only: re-cut the OPEN candidate (vX.Y.Z) from this run''s dev SHA. Voids its checks and approvals. Leave empty for a normal cut.'
        required: false
        default: ''
      amend_confirm:
        description: 'Type the amend version again to confirm'
        required: false
        default: ''
  schedule:
    - cron: '0 9 * * *'

# One cut at a time, across schedule, dispatch and re-runs. Never cancelled: a
# cut that is half done (branch pushed, PR not yet open) must be allowed to end.
concurrency:
  group: release-cut
  cancel-in-progress: false

permissions: {}

jobs:
  mode:
    name: Resolve release flow
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      flow: ${{ steps.flow.outputs.flow }}
    steps:
      - id: flow
        env:
          SWITCH: ${{ vars.RELEASE_CANDIDATE_CUT }}
          DRY_RUN: ${{ inputs.dry_run }}
          AMEND: ${{ inputs.amend }}
        run: |
          if [ "$SWITCH" = "enabled" ] || [ "$DRY_RUN" = "true" ]; then
            echo "flow=candidate" >> "$GITHUB_OUTPUT"
            echo "Release flow: frozen candidate (RELEASE_CANDIDATE_CUT=${SWITCH:-unset}, dry_run=${DRY_RUN:-false})"
          elif [ -n "$AMEND" ]; then
            echo "::error::amend is a frozen-candidate operation, and RELEASE_CANDIDATE_CUT is not enabled. Nothing was changed."
            exit 1
          else
            echo "flow=legacy" >> "$GITHUB_OUTPUT"
            echo "Release flow: legacy dev → main (set the repo variable RELEASE_CANDIDATE_CUT=enabled to switch)"
          fi

  # ── Frozen candidate ───────────────────────────────────────────────────────
  cut:
    name: Cut release candidate
    needs: mode
    if: needs.mode.outputs.flow == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pushes release/v* (never dev or main) and opens/edits the release PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Guard the trigger
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # A dispatch on any other ref would capture that ref's SHA; the engine
          # also refuses a SHA that is not on dev, this just says why sooner.
          if [ "$REF" != "refs/heads/dev" ]; then
            echo "::error::Run the Release workflow on dev (got $REF). A candidate is cut only from dev."
            exit 1
          fi
          # Scheduled cuts are weekday-only, so a candidate never appears
          # unattended on a weekend. A manual dispatch is always honoured.
          if [ "$EVENT" = "schedule" ] && [ "$(date -u +%u)" -gt 5 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Weekend: the scheduled cut is skipped. Dispatch the workflow to cut anyway."
          fi

      # App-authored pushes and PRs trigger CI; GITHUB_TOKEN-authored ones do
      # not. Without the App the candidate still opens, but its checks will not
      # start on their own (and a missing required check blocks the merge).
      - name: Mint release App token
        id: app-token
        if: steps.guard.outputs.skip != 'true' && vars.RELEASE_APP_ID != '' && inputs.dry_run != 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Setup Bun
        if: steps.guard.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Cut or amend the candidate
        id: cut
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token != '' }}
          SOURCE_SHA: ${{ github.sha }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
          AMEND: ${{ inputs.amend }}
          AMEND_CONFIRM: ${{ inputs.amend_confirm }}
          PACKAGE_FILES: 'apps/runner/package.json apps/web/package.json packages/core/package.json packages/shared/package.json'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$APP_TOKEN" != "true" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::warning::No release App token (vars.RELEASE_APP_ID + secrets.RELEASE_APP_PRIVATE_KEY): CI will not start on its own for a candidate opened with GITHUB_TOKEN."
          fi
          args=(--source "$SOURCE_SHA" --package-files "$PACKAGE_FILES")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$AMEND" ]; then
            bun scripts/release-candidate.ts amend --candidate "$AMEND" --confirm "$AMEND_CONFIRM" "${args[@]}"
            exit $?
          fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          bun scripts/release-candidate.ts cut "${args[@]}"

  # ── Legacy dev → main ──────────────────────────────────────────────────────
  prepare-changelog:
    name: Promote CHANGELOG
    needs: mode
    if: needs.mode.outputs.flow == 'legacy'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Promote [Unreleased] section
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname --list 'v*' | head -1)
          [ -z "$LATEST_TAG" ] && LATEST_TAG="v0.0.0"
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log origin/main..dev --format='%s' --no-merges 2>/dev/null || git log --format='%s' --no-merges -50)
          else
            COMMITS=$(git log "${LATEST_TAG}..dev" --format='%s' --no-merges 2>/dev/null || echo "")
          fi

          BUMP="patch"
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if echo "$msg" | grep -qiE 'BREAKING[ -]CHANGE|^[a-z]+!:'; then
              BUMP="major"; break
            elif echo "$msg" | grep -qE '^feat(\(.+\))?:'; then
              BUMP="minor"
            fi
          done <<< "$COMMITS"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_SEMVER="${MAJOR}.${MINOR}.${PATCH}"
          TODAY=$(date -u +"%Y-%m-%d")
          REPO="${{ github.repository }}"

          python3 - "$NEW_SEMVER" "$TODAY" "$LATEST_TAG" "$REPO" <<'PYEOF'
          import sys, re
          new_ver, today, prev_tag, repo = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          with open("CHANGELOG.md") as f:
              content = f.read()
          m = re.search(r'^## \[Unreleased\](.*?)(?=^## \[)', content, re.MULTILINE | re.DOTALL)
          if not m or not re.search(r'^- ', m.group(1), re.MULTILINE):
              print("  i  [Unreleased] has no entries - skipping promotion")
              sys.exit(0)
          content = content.replace("## [Unreleased]\n", f"## [Unreleased]\n\n## [{new_ver}] - {today}\n", 1)
          content = re.sub(
              r'^\[Unreleased\]:.*$',
              f'[Unreleased]: https://github.com/{repo}/compare/v{new_ver}...HEAD\n[{new_ver}]: https://github.com/{repo}/compare/{prev_tag}...v{new_ver}',
              content, flags=re.MULTILINE,
          )
          with open("CHANGELOG.md", "w") as f:
              f.write(content)
          print(f"  Promoted [Unreleased] -> [{new_ver}] ({today})")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet CHANGELOG.md; then
            echo "No CHANGELOG changes to commit"
          else
            git add CHANGELOG.md
            git commit -m "docs: promote CHANGELOG for upcoming release"
            git push origin dev
          fi

  release:
    needs: [mode, prepare-changelog]
    if: needs.mode.outputs.flow == 'legacy'
    # The reusable workflow pushes a version-bump commit and opens the release
    # PR, so it declares contents:write + pull-requests:write. A called workflow
    # cannot exceed the caller's token permissions, and this repo's default
    # workflow permissions are read-only — without this block the run fails at
    # startup (startup_failure) before any job executes. Grant the same scopes
    # here so they can be passed down.
    permissions:
      contents: write
      pull-requests: write
    uses: buildd-ai/.github/.github/workflows/release.yml@main
    with:
      package_files: 'apps/runner/package.json apps/web/package.json packages/core/package.json packages/shared/package.json'
      force: ${{ inputs.force == 'true' }}
    # Pass the release App private key so the reusable workflow can author the
    # release PR as the App (CI then runs without a manual "approve and run").
    # App id comes from vars.RELEASE_APP_ID (enterprise var); only the secret
    # needs explicit passthrough. Absent ⇒ reusable falls back to github.token.
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
