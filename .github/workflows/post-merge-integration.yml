name: Post-merge Integration

# Runs the API integration tests after merge to dev, for any push that carries
# server code no earlier run verified.
#
# Before this, integration ran only on PRs into main whose head was not dev
# (hotfixes), so nothing exercised a live server on the dev→main path: a
# release PR could carry a server regression that no test ran against.
#
# Advisory, by design:
#   - Its own workflow, not a Build & Test job. A multi-minute job there would
#     lengthen every dev-push run, and that workflow's per-ref concurrency would
#     then supersede more pending runs, so fewer dev commits would get a build
#     verdict at all. CI Auto-Fix also triggers on Build & Test only, so a red
#     result here never makes Claude push to dev.
#   - Not a required check anywhere (only `build` is required on main).
#   - The release gate ignores it for ciState and reports it separately as
#     `postMergeIntegration` in release_status (apps/web/src/lib/release/
#     dispatch.ts, matched by the job name prefix "post-merge integration").
#
# The job body is integration.yml, shared with the hotfix-PR and release-
# candidate paths, and it serialises all of them on the one test machine.
#
# Incremental, not "everything ahead of main": the `changes` job tests only
# what changed since the newest dev ancestor whose integration run actually
# passed (scripts/ci/post-merge-coverage.ts). A docs push on top of a tested
# server change no longer re-requests the machine; a server change whose run
# failed, was cancelled or was superseded stays in the diff until one passes.
# A skipped run is reported as skipped, never as passing.

on:
  push:
    branches: [dev]
  workflow_dispatch:

# One post-merge run at a time; GitHub keeps one pending run per group, so a
# burst of pushes coalesces into the newest. A running one is left to finish
# so its SHA still gets a verdict.
concurrency:
  group: post-merge-integration
  cancel-in-progress: false

permissions:
  contents: read
  # Reads this workflow's earlier runs and their jobs: that is the evidence.
  actions: read

jobs:
  changes:
    # Also posts a check-run on the release PR head, so it needs the advisory
    # prefix too; a bare "changes" would count toward the release PR's ciState.
    name: post-merge integration / changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      runner: ${{ steps.filter.outputs.runner }}
      reason: ${{ steps.filter.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Decide coverage from the last verified dev run
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail closed: if the decision itself errors, test everything.
          if ! bun run scripts/ci/post-merge-coverage.ts; then
            echo "::warning::coverage decision failed; testing API and runner"
            printf 'api=true\nrunner=true\nreason=error\n' >> "$GITHUB_OUTPUT"
          fi

  integration:
    # Must start with "post-merge integration": the release gate matches the
    # check-run name ("<this name> / integration") by that prefix, and
    # scripts/ci/post-merge-coverage.ts reads earlier runs by that exact name.
    name: post-merge integration
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/integration.yml
    secrets: inherit
    with:
      api: true
      runner: ${{ needs.changes.outputs.runner == 'true' }}
      e2e: false
      neon_branch: ci/post-merge-dev
      checkout_sha: ${{ github.sha }}
      source: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'post-merge-dev' }}
