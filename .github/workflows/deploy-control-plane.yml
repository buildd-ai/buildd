name: Deploy Control Plane

# Deploys the execution control plane Worker (apps/control-plane,
# `buildd-control-plane`) in lockstep with the web app. The Worker bundles
# apps/web's own execution handlers (claim, worker PATCH, GitHub webhook,
# Dispatch callbacks) at deploy time, so it must run exactly the commit
# production web runs, deployed after that commit's migrations. It owns
# buildd.dev's execution routes (docs/specs/execution-control-plane.md).
#
# Trigger: a successful Production deployment of the web app (Vercel runs the
# migrations in its build), so the Worker follows the same SHA and never
# leads the schema. workflow_dispatch is the manual path (redeploy, rollback).
#
# NOTE: deployment_status workflows run from the file on the default branch
# (`dev`), even for deploys of `main`.
#
# Auth: the same Cloudflare account as Dispatch (the buildd.dev zone), via
# CF_DISPATCH_API_TOKEN / CF_DISPATCH_ACCOUNT_ID. The Worker's runtime secrets
# are already on it; a deploy keeps them.

on:
  deployment_status: {}
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit to deploy (default: the run ref). Use the SHA production web runs.'
        required: false
        default: ''

concurrency:
  group: deploy-control-plane
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy buildd-control-plane
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment.environment == 'Production' && github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHA: ${{ inputs.ref || github.event.deployment.sha || github.sha }}
    steps:
      - name: Check deploy secrets are set
        env:
          HAS_TOKEN: ${{ secrets.CF_DISPATCH_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CF_DISPATCH_ACCOUNT_ID != '' }}
        run: |
          [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ] || { echo "::error::Missing CF_DISPATCH_API_TOKEN / CF_DISPATCH_ACCOUNT_ID."; exit 1; }

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      # A commit from before the control plane existed has nothing to deploy.
      - name: Skip a commit without the control plane
        id: present
        run: |
          if [ -f apps/control-plane/wrangler.jsonc ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No apps/control-plane at $SHA; nothing to deploy."; fi

      - name: Setup Bun
        if: steps.present.outputs.present == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        if: steps.present.outputs.present == 'true'
        run: bun install --frozen-lockfile

      - name: Worker tests
        if: steps.present.outputs.present == 'true'
        run: bun run scripts/run-unit-tests.ts apps/control-plane/src

      - name: Deploy
        if: steps.present.outputs.present == 'true'
        working-directory: apps/control-plane
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DISPATCH_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_DISPATCH_ACCOUNT_ID }}
        run: bunx wrangler deploy --var "GIT_SHA:$SHA"

      # Lockstep is the contract: the Worker must report the SHA web deployed.
      - name: Verify the Worker runs this commit
        if: steps.present.outputs.present == 'true'
        run: |
          url="https://control-plane.buildd.dev/__control-plane/health?deep=1"
          for i in $(seq 1 12); do
            body=$(curl -fsS -m 15 "$url" || true)
            # Deep health: GitHub (anonymous and as the App), Pusher, storage and
            # Redis from the Worker. The 2026-10-10 cutover lost GitHub (no
            # User-Agent) and Pusher (node-fetch) without any route failing.
            if [ "$(printf '%s' "$body" | jq -r '.commit // empty')" = "$SHA" ] && [ "$(printf '%s' "$body" | jq -r '.ok')" = "true" ]; then echo "Health: $body"; exit 0; fi
            sleep 10
          done
          echo "::error::control-plane is not healthy at $SHA after deploy (last: ${body:-no answer}). Roll back: set EXECUTION_MODE=shadow and redeploy."
          exit 1
