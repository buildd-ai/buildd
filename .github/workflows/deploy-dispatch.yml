name: Deploy Dispatch

# Deploys the Cloudflare Dispatch Worker (apps/dispatch, `buildd-dispatch`).
#
# Ships with the release that contains the change, like the web app: a push to
# `main` touching the Worker or its wire contract deploys it. `dev` merges are
# inert. `workflow_dispatch` is the manual path (first deploy, redeploy, or a
# rollback to an older ref).
#
# Auth is the env token only. The wrangler profile binding in the README
# (`wrangler auth activate`) lives in the owner's user config, not the repo, so
# a runner never has one; and wrangler reads CLOUDFLARE_API_TOKEN before any
# stored profile, and CLOUDFLARE_ACCOUNT_ID when wrangler.jsonc has no
# account_id (it has none, on purpose).
#
# Requires repo SECRETS (never vars; Actions logs here are world-readable):
#   CF_DISPATCH_API_TOKEN, CF_DISPATCH_ACCOUNT_ID
# Pushed from Doppler `buildd/dev_ci` with gh-secret-push. The Worker's runtime
# secrets (PUBLISH_SECRET, CALLBACK_SECRET) are already on the Worker; a deploy
# keeps them and this workflow never sets them.

on:
  push:
    branches: [main]
    paths:
      - 'apps/dispatch/**'
      - 'packages/dispatch-contract/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch, tag or SHA). Defaults to the ref the run was started on.'
        required: false
        default: ''

concurrency:
  group: deploy-dispatch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy buildd-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Before checkout, so a missing secret fails in seconds with a clear
      # message. Tested through env, never echoed.
      - name: Check deploy secrets are set
        env:
          HAS_TOKEN: ${{ secrets.CF_DISPATCH_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CF_DISPATCH_ACCOUNT_ID != '' }}
        run: |
          missing=""
          [ "$HAS_TOKEN" = "true" ] || missing="$missing CF_DISPATCH_API_TOKEN"
          [ "$HAS_ACCOUNT" = "true" ] || missing="$missing CF_DISPATCH_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing. Push them from Doppler buildd/dev_ci with gh-secret-push (see apps/dispatch/README.md, Deploy)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Worker tests
        run: bun run scripts/run-unit-tests.ts apps/dispatch/src packages/dispatch-contract

      - name: Type check
        working-directory: apps/dispatch
        run: bunx tsc --noEmit

      - name: Deploy
        working-directory: apps/dispatch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DISPATCH_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_DISPATCH_ACCOUNT_ID }}
        run: bunx wrangler deploy

      # `configured:false` means the Worker is up but fails closed (a missing
      # runtime secret or BUILDD_SERVER): every /v1 route answers 503.
      - name: Smoke test /health
        run: |
          url="https://dispatch.buildd.dev/health"
          body=""
          for i in 1 2 3 4 5 6; do
            if body=$(curl -fsS -m 15 "$url"); then
              break
            fi
            body=""
            echo "Attempt $i: $url not reachable yet, retrying in 10s"
            sleep 10
          done
          if [ -z "$body" ]; then
            echo "::error::$url did not answer after the deploy."
            exit 1
          fi
          echo "Health: $body"
          if ! printf '%s' "$body" | jq -e '.configured == true' > /dev/null; then
            echo "::error::Deployed, but /health is not configured:true. The Worker fails closed; check PUBLISH_SECRET, CALLBACK_SECRET and BUILDD_SERVER."
            exit 1
          fi
