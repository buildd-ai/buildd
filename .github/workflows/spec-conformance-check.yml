# Spec Conformance Check — Tier-1/Tier-2 blocking checker, per
# docs/design/spec-conformance.md §3.
#
# `scripts/check-spec-conformance.ts` (Slice 1's evaluator) existed with zero
# CI wiring: `bun run specs:conformance` worked from a shell, but nothing
# invoked it on a PR, so a declared-vs-derived status contradiction (§2) never
# failed a build. §3 is explicit that CI, not the pre-commit hook, is the
# actual enforcement point — pre-commit is bypassable by design and workers
# commit without running hooks at all. This workflow is that enforcement
# point: `--fail-on-contradiction` turns a contradiction into a failing
# check on the PR that introduced it (see Case 1/3 in the design doc's
# Worked Examples).
#
# Same triggers as Build & Test (build.yml) for the same reason given there:
# an unlisted base branch means zero runs, which looks exactly like a green
# check to anything that only looks for *failing* ones.
#
# No delta gate. This job used to skip the checker when the diff against the
# last-recorded sha (`spec-conformance-last-sha`) touched nothing in the watch
# set, and `record` advanced that sha on push to dev even when the checker
# FAILED. So a red push was followed by green ones: each later push diffed
# against the failing commit, saw nothing watched, and skipped. dev stayed
# green over a failing checker, and the failure surfaced only on the next PR
# that happened to touch docs/specs. The checker is filesystem-only and runs in
# well under a second, less than the gate's own artifact lookup, so it now
# runs on every event. The ledger workflow still uses the gate under its own
# key; there it saves DB writes, not checker time.
#
# Schedule: a `skip_until` suppression expires on a date, not a commit, so a
# doc can start contradicting with nothing pushed. The daily run catches that
# on dev instead of on the next unrelated PR.
#
# Contradiction watch: a PR that flips a doc's derived status without
# updating its declared frontmatter can merge to dev without itself failing
# this check (see PR #2352 — the doc wasn't in that PR's own failure path),
# leaving dev's own tip red for whichever unrelated PR merges next to
# diagnose. scripts/spec-conformance-contradiction-watch.ts runs only on dev
# (push or schedule), after the checker, and diffs the freshly evaluated contradiction
# set against the last-recorded one (`spec-conformance-contradiction-docs`
# artifact) — a NEW contradiction files a `[friction]` task immediately
# instead of waiting on the next PR author to notice. Best-effort only: never
# fails the build, no-ops on missing WORKSPACE_ID/BUILDD_API_KEY, and a cold
# start (no prior recorded set) just records state without alerting.
name: Spec Conformance Check

on:
  push:
    branches: [dev]
  pull_request:
    branches: ['**', main, dev, 'mission/**']
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Tier-2 CI — assertion evaluation (blocking)
    runs-on: ubuntu-latest
    env:
      WORKSPACE_ID: ${{ vars.WORKSPACE_ID }}
      BUILDD_API_KEY: ${{ secrets.BUILDD_API_KEY }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run spec conformance checker
        run: bun run specs:conformance -- --fail-on-contradiction

      - name: Alert on new spec-conformance contradictions (dev only)
        if: always() && github.event_name != 'pull_request'
        run: bun run scripts/spec-conformance-contradiction-watch.ts
