name: Build & Test

on:
  push:
    branches: [dev]
  pull_request:
    # A base-name allowlist is the wrong shape for a signal auto-merge depends on.
    # An unlisted base means NO Build & Test run at all — and because ci-fix.yml
    # triggers on `workflow_run` of this workflow, the CI-retry chain goes silent
    # with it. A PR with zero runs then looks exactly like a green one to anything
    # that only checks for *failing* checks, so every new branch convention is one
    # forgotten line away from unverified auto-merges. `**` is the catch-all that
    # removes that failure mode; the named branches below are kept as the record
    # of which bases this workflow is *meant* to gate:
    #   main, dev            — trunk
    #   mission/**           — mission integration branches
    #                          (docs/design/mission-delivery-arc.md)
    branches: ['**', main, dev, 'mission/**']

# One run per ref. PR runs are superseded by a new push to the same PR, so
# cancelling is free; pushes to `dev` are NOT cancelled — each commit's verdict
# is the record for the promotion that follows it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  # `build` used to be one serial job: lints + type check, unit tests and the
  # Next build back to back. It is now three parallel jobs (build-checks,
  # build-unit-tests, build-next) plus the `build` aggregator at the end, which
  # keeps the check name branch protection on main requires. Every step below
  # is the same step it was; only the grouping changed. Guarded by
  # scripts/build-workflow-split.test.ts.
  build-checks:
    name: build · lints + type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint workflow name fields
        run: |
          # Self-test: verify the linter catches a workflow without a name: key
          printf 'on: [push]\njobs:\n  x:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo hi\n' \
            > /tmp/_lint_test_no_name.yml
          if grep -q '^name:' /tmp/_lint_test_no_name.yml; then
            echo "::error::Self-test bug — grep matched name: in a file that has none"
            exit 1
          fi
          echo "Self-test passed: linter correctly identifies missing name: ✓"

          # Lint every workflow file — unnamed files are the fingerprint of agent scratch work
          failed=0
          for f in .github/workflows/*.yml; do
            if ! grep -q '^name:' "$f"; then
              echo "::error file=$f::Missing top-level 'name:' key — add 'name: <descriptive-name>' as the first field"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo "One or more workflow files are missing a 'name:' key."
            echo "Every .github/workflows/*.yml must have a top-level name: to prevent unnamed scratch workflows from accumulating on dev."
            exit 1
          fi
          echo "All workflow files have a name: key ✓"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Lint specs (frontmatter + dead paths + index)
        run: bun run scripts/check-specs.ts --check

      - name: Check design drift
        run: bun run design:check

      - name: Check UI copy (AI-voice ratchet)
        run: bun run copy:check

      # Open-core boundary: design/strategy prose lives in the private
      # knowledge-base repo. docs/design keeps only frontmatter stubs (plus
      # design-system.md and DESIGN-FORMAT.md); docs/plans and docs/reports
      # (bar gate-audit.md) stay empty. See scripts/check-public-docs.ts.
      - name: Lint public docs boundary (design stubs only)
        run: bun run public-docs:check

      # Bootstrappability gate: the repo's own .buildd/env.yaml must be satisfiable.
      # Catches a broken/unparseable manifest, lockfile drift (the manifest declares
      # `bun install --frozen-lockfile`, which the non-frozen install above does not
      # enforce), a missing declared toolchain, or a broken readiness command —
      # before any of it ever reaches an agent. Same contract the runner gate uses.
      - name: Verify env contract (buildd env verify)
        run: bun run env:verify

      - name: Check migrations are up to date
        id: migration_check
        run: |
          cd packages/core
          # drizzle-kit aborts without generating anything and STILL EXITS 0. A
          # generate that aborts writes nothing, which the porcelain check below
          # cannot tell apart from "no changes needed" — so this step used to
          # report success over a db:generate that never ran.
          #
          # The collision/malformed branch is fixed at the root by
          # patches/drizzle-kit@*.patch (exit 0 -> exit 1), guarded by
          # packages/core/__tests__/drizzle-kit-patch.test.ts. This output check
          # stays for the abort paths the patch does NOT cover: the
          # "snapshot is not of the latest version" branch still exits 0, and it
          # prints via console.log rather than as an Error.
          # Capture before asserting: the step runs under `bash -e`, so letting a
          # now-nonzero db:generate fail the assignment would kill the step before
          # its output is ever echoed, leaving no diagnosis in the log.
          set +e
          out=$(bun db:generate 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error::bun db:generate exited $code (see output above)."
            exit 1
          fi
          if grep -qE '^Error:|is not of the latest version' <<<"$out"; then
            echo "::error::bun db:generate aborted without generating, yet exited 0 (see output above)."
            exit 1
          fi
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::Schema changes detected but migrations not committed!"
            echo "Run 'cd packages/core && bun db:generate' and commit the generated files."
            git status drizzle/
            git diff drizzle/
            exit 1
          fi
          echo "Migrations are up to date"

      - name: Notify on migration check failure
        if: failure() && steps.migration_check.outcome == 'failure'
        env:
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_TOKEN_ALERT: ${{ secrets.PUSHOVER_TOKEN_ALERT }}
        run: |
          if [ -z "$PUSHOVER_USER" ] || [ -z "$PUSHOVER_TOKEN_ALERT" ]; then exit 0; fi
          PR="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="schema.ts changed without a migration file in PR #${{ github.event.pull_request.number }} (${{ github.head_ref || github.ref_name }}). Run cd packages/core && bun db:generate and commit."
          curl -s --form-string "token=${PUSHOVER_TOKEN_ALERT}" \
            --form-string "user=${PUSHOVER_USER}" \
            --form-string "title=❌ Migration gate failed" \
            --form-string "message=${MSG}" \
            --form-string "priority=1" \
            --form-string "url=${PR}" \
            --form-string "url_title=View CI run" \
            https://api.pushover.net/1/messages.json || true

      # Journal ordering is load-bearing and must not ride on the affected-tests
      # fan-out. Drizzle's migrator applies migrations by the journal's `when`
      # high-water-mark, so a migration whose `when` is lower than an
      # already-applied one is silently recorded as applied and its DDL never
      # runs. Today `scripts/affected-tests.sh` fans out to ALL for any
      # `packages/core/` change (which every migration touches), so this test does
      # execute -- but only as a side effect of that mapping, and it is also
      # enforced by `.githooks/pre-commit`, which `--no-verify` bypasses and CI
      # never runs. Invoke the gate by name so a future change to either one
      # cannot quietly remove it.
      - name: Lint migration journal ordering
        run: bun run migrations:lint

      - name: Lint hardcoded model IDs
        # The self-test runs first: it plants a known violation outside the
        # allowlist and requires the scan to catch it, so a pattern or allowlist
        # change that empties the check's input set fails here instead of going
        # green over nothing (see C30 in scripts/lint-model-ids.ts).
        run: |
          bun run scripts/lint-model-ids.ts --self-test
          bun run scripts/lint-model-ids.ts

      - name: Lint hand-built SQL
        # Same self-test-first shape as the model-ID lint above, replaying the
        # two historical defects (ANY(${array}) as a param list; a bare
        # camelCase property Postgres folds to a nonexistent column) as
        # fixtures that must fail, alongside fixed/clean forms that must pass.
        # See scripts/lint-hand-built-sql.ts for the incidents this traces to.
        run: |
          bun run scripts/lint-hand-built-sql.ts --self-test
          bun run scripts/lint-hand-built-sql.ts

      # `next build` in build-next skips its own type check (CI_TYPECHECK_DONE,
      # see apps/web/next.config.mjs), so this step must cover what it covered:
      # the same apps/web tsconfig, including the generated route types under
      # .next/types that tsconfig includes and only exist after typegen.
      - name: Generate Next route types
        run: cd apps/web && bunx next typegen

      # apps/web's tsconfig is `incremental`; tsc validates the restored
      # buildinfo by file content hashes, so a stale entry only costs a recheck.
      - name: Cache apps/web tsbuildinfo
        uses: actions/cache@v6
        with:
          path: apps/web/tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ github.sha }}
          restore-keys: tsbuildinfo-${{ runner.os }}-

      - name: Type check
        run: bun run type-check

  # Sharded: every shard computes the same selection (scripts/affected-tests.ts
  # is deterministic over the same checkout) and runs its own slice of it,
  # balanced by scripts/test-durations.json. A small selection lands entirely
  # on shard 1 and the others run nothing. The shard count is SHARD_COUNT in
  # scripts/run-unit-tests.ts; run-unit-tests-shard.test.ts keeps them equal.
  # fail-fast off: a red shard must not cancel the others, or their failures
  # go unreported and the next push finds them one shard at a time.
  build-unit-tests:
    name: build · unit tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v7
        with:
          # scripts/affected-tests.ts diffs a PR against its base.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Before selection: the import graph resolves workspace packages through
      # node_modules, exactly as the tests will.
      - name: Install dependencies
        run: bun install

      # Pushes and PRs into main run ALL (dev stays the full safety net); PRs
      # into dev and mission branches select by reverse import graph. The
      # reasoning is printed as notices either way.
      - name: Detect affected tests
        id: affected
        run: |
          bun scripts/affected-tests.ts > "$RUNNER_TEMP/affected.txt"
          echo "tests=$(tail -n 1 "$RUNNER_TEMP/affected.txt")" >> "$GITHUB_OUTPUT"

      # Always via scripts/run-unit-tests.ts, which runs each file in its OWN
      # process. `bun test <many files>` shares one process, and `mock.module`
      # replaces a module globally for that process' lifetime with no way to undo
      # it -- so one file's partial stub deletes another file's imports, and
      # which file dies depends on load order. That is what made this step fail
      # on a set of tests that every developer saw pass locally. The runner also
      # writes .test-report.log and prints a digest of failing files last.
      - name: Run tests
        if: steps.affected.outputs.tests != 'SKIP'
        timeout-minutes: 10
        env:
          BUILDD_TEST_CONCURRENCY: 8
          TESTS: ${{ steps.affected.outputs.tests }}
        run: |
          # ALL and SKIP are sentinels the script understands; a file list is
          # passed through and filtered to unit tests. Word splitting is the
          # point here: one argument per file.
          # shellcheck disable=SC2086
          bun run scripts/run-unit-tests.ts --shard "${{ matrix.shard }}/3" $TESTS

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report-${{ matrix.shard }}
          path: .test-report.log
          if-no-files-found: ignore
          retention-days: 7

  build-next:
    name: build · next build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      # The kit's source imports are extensionless so apps/web (Turbopack) can
      # consume it from source; its build rewrites them to `.js` for the
      # published ESM. The apps/web build below proves the first half; this
      # proves the second on plain Node, which only the tag-triggered publish
      # workflow checked before.
      - name: Build @builddai/ai-kit dist and import it on Node
        run: |
          cd packages/ai-kit
          bun run build
          node scripts/smoke-dist.mjs

      # smoke-dist imports dist/ inside the monorepo, where every devDependency
      # resolves. This installs the packed tarball into a clean project outside
      # it (public registry only) and imports every entry with and without the
      # optional peers, the way a consumer gets it. 0.1.0's /decide fails here.
      - name: Install @builddai/ai-kit into a clean consumer project
        run: node packages/ai-kit/scripts/smoke-consumer.mjs

      - name: Cache Next build cache
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/web/src/**', 'apps/web/public/**', 'apps/web/*.mjs', 'apps/web/*.json', 'packages/**/*.ts', 'packages/**/*.tsx', '!**/node_modules/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        run: cd apps/web && bun run build:only
        env:
          # Dummy values for build (not connecting to real DB)
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          AUTH_SECRET: "dummy-secret-for-build"
          # build-checks type-checks the same tsconfig, and `build` needs it,
          # so the Next build skips its duplicate check. Honoured only in
          # GitHub Actions — see buildSkipsTypecheck in apps/web/next.config.mjs.
          CI_TYPECHECK_DONE: "1"

  # The required check. Branch protection on main requires a check named
  # exactly `build`, and app-side auto-merge reads check-run names too, so this
  # keeps that name and goes green only when all three parts did. The unit
  # tests are a matrix: `needs.build-unit-tests.result` is success only when
  # every shard succeeded, and failure/cancelled if any one did not. always():
  # a failed or cancelled part must make this red, never Skipped — a Skipped
  # check satisfies branch protection without running.
  build:
    needs: [build-checks, build-unit-tests, build-next]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All build parts passed
        run: |
          failed=0
          for r in "checks=${{ needs.build-checks.result }}" \
                   "unit-tests=${{ needs.build-unit-tests.result }}" \
                   "next=${{ needs.build-next.result }}"; do
            echo "$r"
            [ "${r#*=}" = "success" ] || failed=1
          done
          [ "$failed" -eq 0 ] || { echo "::error::a build part did not succeed (see above)"; exit 1; }

  # The ONLY test that spawns a real bwrap namespace and asserts that blocked paths
  # are genuinely inaccessible (apps/runner/src/__tests__/mount-isolation.e2e.ts,
  # `describe('negative isolation')`), plus the Quality Scout probe sandbox suite
  # (apps/runner/src/__tests__/scout-sandbox.e2e.ts). Every other bwrap test only snapshots argv
  # strings or mocks the SDK. Until now nothing invoked this file: it is *.e2e.ts, so
  # scripts/run-unit-tests.ts (which globs **/*.test.{ts,tsx} under a fixed set of
  # roots) cannot collect it, and no workflow or package script named it.
  #
  # Why its own job instead of a step in `build`:
  #   * it needs an apt package (bubblewrap) and a kernel capability (unprivileged
  #     user namespaces) that nothing else in the suite needs -- putting that on the
  #     required check's critical path taxes every PR;
  #   * it must be able to skip cleanly where the kernel denies user namespaces, and
  #     a separate job keeps that outcome from being confused with a type-check or
  #     unit-suite failure;
  #   * the file must stay OUT of the unit suite: it spawns real git repos and
  #     subprocesses, so folding it into `bun test` would slow every local run.
  # Why in build.yml rather than a new workflow: it inherits the same triggers as the
  # rest of the test gating (push to dev, PRs to dev/main) and lands in the same
  # check suite. It needs no schedule and no `workflow_run` hook -- both of which are
  # read only from the default branch and are therefore easy to leave dead.
  sandbox-isolation:
    name: Sandbox isolation probe (bwrap)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install

      - name: Install bubblewrap
        run: |
          # The runner image preloads a packages.microsoft.com source (for
          # dotnet/azure-cli/etc.) that this job never uses. When that repo's
          # signing key rotates or 403s, it fails `apt-get update` outright even
          # though the Ubuntu archive bubblewrap actually comes from is fine --
          # so drop it before updating rather than let an unrelated repo's
          # flakiness take this job down.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --version

      # Printed unconditionally: when the probe below reports a skip, these values
      # are the evidence for *why* (Ubuntu 24.04 images can restrict unprivileged
      # user namespaces via AppArmor).
      # GitHub's Ubuntu 24.04 images ship
      # kernel.apparmor_restrict_unprivileged_userns=1, which denies exactly the
      # namespace bwrap needs — the first run of this job skipped 13 of 24 tests
      # for that reason, i.e. it proved nothing about isolation. Runners have sudo,
      # so relax it here. Best-effort: `|| true` keeps the job alive on an image
      # without the knob, and the probe's own banner still reports which mode ran,
      # so a silent skip cannot masquerade as a pass.
      - name: Permit unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Report user-namespace capability
        run: |
          for key in kernel.unprivileged_userns_clone user.max_user_namespaces kernel.apparmor_restrict_unprivileged_userns; do
            echo "$key = $(sysctl -n "$key" 2>/dev/null || echo '<unset>')"
          done

      # Two suites, one per sandbox, each spawning real bwrap namespaces:
      #   * mount-isolation.e2e.ts -- the agent worker's outer mount allowlist
      #     (buildWorkerBwrapArgv), banner MOUNT_ISOLATION_MODE;
      #   * scout-sandbox.e2e.ts -- the Quality Scout command-probe sandbox
      #     (buildScoutBwrapArgv + buildScoutProbeEnv), banner SCOUT_SANDBOX_MODE.
      #
      # A `skipped` banner FAILS this job. Until the capability probes bound the
      # ELF loader dirs (/lib, /lib64), every run here printed
      # `execvp /usr/bin/env: No such file or directory`, reported `skipped`, and
      # passed with a warning nobody read -- the job never once verified
      # isolation. GitHub's hosted runners do support the namespaces (after the
      # sysctl above), so a skip here is a broken probe, not a kernel limit.
      - name: Sandbox isolation probes
        timeout-minutes: 10
        run: |
          set -o pipefail
          status=0
          for spec in \
            "apps/runner/src/__tests__/mount-isolation.e2e.ts MOUNT_ISOLATION_MODE" \
            "apps/runner/src/__tests__/scout-sandbox.e2e.ts SCOUT_SANDBOX_MODE"; do
            set -- $spec
            FILE=$1; BANNER=$2; LOG="/tmp/$(basename "$FILE" .e2e.ts).log"
            echo "::group::$FILE"
            if [ ! -f "$FILE" ]; then
              echo "::error::$FILE is missing -- the sandbox isolation gate has nothing to run."
              status=1; echo "::endgroup::"; continue
            fi
            # The ./ prefix matters: without it `bun test` treats the argument as a
            # name filter, and since the file is *.e2e.ts rather than *.test.ts it
            # matches nothing.
            bun test "./$FILE" 2>&1 | tee "$LOG" || status=1
            echo "::endgroup::"

            # Silent-green guard: a run that collected nothing must fail, not pass.
            if ! grep -q "^Ran [0-9]* tests across 1 file" "$LOG"; then
              echo "::error::$FILE collected no tests -- the file was renamed, moved, or failed to load."
              status=1; continue
            fi
            if grep -q "^$BANNER=full" "$LOG"; then
              if grep -qE "^ *[0-9]+ skip" "$LOG"; then
                echo "::error::$FILE: bwrap was available but tests still reported skipped -- the capability probe and the per-test guards disagree."
                status=1
              else
                echo "::notice::$FILE: $BANNER=full -- negative isolation assertions ran inside a real bwrap namespace."
              fi
            elif grep -q "^$BANNER=skipped" "$LOG"; then
              echo "::error::$FILE: $BANNER=skipped -- no namespace assertion ran. This runner supports bwrap user namespaces, so the capability probe is broken (see its 'probe declined' line above)."
              status=1
            else
              echo "::error::$FILE printed no $BANNER=full|skipped banner -- a skipped run could pass unnoticed."
              status=1
            fi
          done
          exit $status

  # Pre-promote schema drift check — must produce a definitive pass/fail on every PR,
  # never Skipped. GitHub branch protection treats Skipped as satisfying a required
  # check, so a job-level `if:` that evaluates false lets non-main PRs merge without
  # the gate ever running. Instead we gate at the step level: the job always runs,
  # exits 0 immediately for non-main PRs, and runs the real check only for dev→main.
  schema-drift:
    name: Schema Drift / check-prod
    runs-on: ubuntu-latest
    # No job-level if: — job must always run so it always emits success/failure,
    # never the Skipped status that satisfies branch protection without actually running.

    steps:
      - name: Determine if drift check applies
        id: gate
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.base_ref }}" == "main" ]]; then
            echo "applies=true" >> "$GITHUB_OUTPUT"
            echo "Base ref is 'main' — running production schema drift check."
          else
            echo "applies=false" >> "$GITHUB_OUTPUT"
            echo "Base ref is '${{ github.base_ref }}' (not main) — drift check not required for this PR."
            echo "Emitting explicit success so branch protection sees a real pass, not a Skipped status."
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.applies == 'true'

      - name: Setup Bun
        if: steps.gate.outputs.applies == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        if: steps.gate.outputs.applies == 'true'
        run: bun install

      - name: Run schema drift check against production DB
        if: steps.gate.outputs.applies == 'true'
        id: drift_check
        # Exit 1 is a drift verdict; exit 2 means the gate could not make a
        # trustworthy comparison at all (a forked snapshot chain, a missing
        # DATABASE_URL) and does NOT implicate production. Capture the code so
        # the alert can tell a responder which one happened — see
        # docs/design/migration-doctrine.md Rule 7.
        run: |
          set +e
          bun run scripts/check-schema-drift.ts
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Notify on schema drift
        if: failure() && steps.drift_check.outcome == 'failure'
        env:
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_TOKEN_ALERT: ${{ secrets.PUSHOVER_TOKEN_ALERT }}
        run: |
          if [ -z "$PUSHOVER_USER" ] || [ -z "$PUSHOVER_TOKEN_ALERT" ]; then exit 0; fi
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          if [ "${{ steps.drift_check.outputs.exit_code }}" = "2" ]; then
            TITLE="⚠️ Schema gate could not verify — release blocked"
            MSG="The schema-drift gate could not make a trustworthy comparison (likely a forked snapshot chain) so it produced NO drift verdict. Production is NOT implicated. Release PR #${PR_NUM} is blocked until the repo metadata is repaired — see the CI logs and migration-doctrine Rule 7."
          else
            TITLE="🚨 Schema drift gate failed — release blocked"
            MSG="Production DB schema has drifted from Drizzle migrations. Release PR #${PR_NUM} is blocked. Check the CI logs and open a reconciliation PR before promoting."
          fi
          curl -s --form-string "token=${PUSHOVER_TOKEN_ALERT}" \
            --form-string "user=${PUSHOVER_USER}" \
            --form-string "title=${TITLE}" \
            --form-string "message=${MSG}" \
            --form-string "priority=1" \
            --form-string "url=${PR_URL}" \
            --form-string "url_title=View release PR" \
            https://api.pushover.net/1/messages.json || true

  # Real-SQL architecture suite (apps/web/tests/db): the dispatch authority's
  # invariants live in a trigger and CTEs that a mocked `db` cannot observe.
  # Postgres + the neon-http proxy the app's driver speaks, migrated from
  # scratch, so this also proves every migration applies to an empty database.
  #
  # Why this can run twice for one release PR, and when it doesn't:
  #   push to dev   -> tests the branch HEAD (the dev commit itself)
  #   pull_request  -> tests GitHub's synthetic merge ref (head merged into base)
  # For a PR into `dev` or a hotfix those are different trees and both are kept.
  # For a release PR (head = dev) the push run already covered the same commit, so
  # when the merge ref's tree is identical to the head's tree AND that commit's push
  # run already passed this job, the PR run records a pass without repeating the work.
  # It never *skips* the job (a Skipped check satisfies branch protection without
  # running); it always completes, and when the merge ref differs (main moved ahead
  # of dev) or the push run is missing/red/in progress, it runs the full suite.
  # The name says which ref is under test, so the two checks are not near-twins.
  db-architecture:
    name: DB architecture (real Postgres) · ${{ github.event_name == 'pull_request' && 'merge ref' || 'branch HEAD' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      DATABASE_URL: postgres://demo:demo@localhost:5432/buildd_test
      NEON_LOCAL_FETCH_ENDPOINT: http://127.0.0.1:4444/sql
      RUN_DB_TESTS_DOUBLE_RUN: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # Started by hand rather than as a `services:` container, and not from
      # Docker Hub: shared runner IPs hit its anonymous pull limit under load,
      # and a service container cannot retry. The official postgres image comes
      # from the ECR Public mirror; pgvector is installed from the PGDG apt repo
      # the image already has configured.
      - name: Start Postgres (pgvector)
        run: |
          IMAGE=public.ecr.aws/docker/library/postgres:17
          for attempt in 1 2 3 4 5; do
            docker pull "$IMAGE" && break
            if [ "$attempt" = 5 ]; then echo "::error::docker pull $IMAGE failed 5/5 times"; exit 1; fi
            sleep $((15 * attempt))
          done
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=demo -e POSTGRES_PASSWORD=demo -e POSTGRES_DB=buildd_test \
            "$IMAGE"
          docker exec postgres bash -c 'apt-get update -qq && apt-get install -y -qq postgresql-17-pgvector >/dev/null'
          for i in $(seq 1 60); do
            docker exec postgres pg_isready -U demo -d buildd_test && break
            sleep 2
          done
          docker exec postgres pg_isready -U demo -d buildd_test || { echo "::error::Postgres did not become ready"; exit 1; }
          docker exec postgres psql -U demo -d buildd_test -c 'CREATE EXTENSION IF NOT EXISTS vector' \
            || { echo "::error::pgvector did not install"; exit 1; }
      - name: Detect redundant run (release PR already covered by the dev push run)
        id: dedupe
        if: github.event_name == 'pull_request' && github.head_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          # HEAD is the synthetic merge commit; HEAD^2 is the PR head.
          merge_tree=$(git rev-parse 'HEAD^{tree}')
          head_tree=$(git rev-parse 'HEAD^2^{tree}' 2>/dev/null || true)
          if [ -z "$head_tree" ] || [ "$merge_tree" != "$head_tree" ]; then
            echo "Merge ref differs from branch HEAD — running the suite."
            exit 0
          fi
          runs=$(gh api "repos/$REPO/actions/workflows/build.yml/runs?head_sha=$HEAD_SHA&event=push" --jq '.workflow_runs[].id' || true)
          for id in $runs; do
            ok=$(gh api "repos/$REPO/actions/runs/$id/jobs" --paginate \
              --jq '[.jobs[] | select(.name | startswith("DB architecture (real Postgres)")) | select(.conclusion == "success")] | length' || true)
            if [ "${ok:-0}" -gt 0 ]; then
              echo "Merge ref tree == branch HEAD tree and push run $id already passed this suite."
              echo "redundant=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No passing push run for $HEAD_SHA yet — running the suite."
      # apps/web/tests/db/migration-baseline.test.ts replays the pre-squash
      # migration tree from this tag (LAST_RELEASE_BEFORE_SQUASH in
      # packages/core/db/migrate-plan.ts) to prove the baseline equivalent; a
      # shallow checkout carries no tags.
      - name: Fetch the pre-squash release tag
        if: steps.dedupe.outputs.redundant != 'true'
        run: git fetch --no-tags --depth=1 origin +refs/tags/v0.284.0:refs/tags/v0.284.0
      - uses: oven-sh/setup-bun@v2
        if: steps.dedupe.outputs.redundant != 'true'
        with:
          bun-version: "1.4.2"
      - if: steps.dedupe.outputs.redundant != 'true'
        run: bun install
      # The app's unchanged neon-http driver talks to scripts/ci/neon-sql-shim.ts:
      # the same /sql wire protocol as the local neon-http proxy it replaced,
      # over one persistent pg pool instead of a control-plane lookup, a SCRAM
      # handshake and a fresh connection per query. Migrate and the tests both
      # go through it, so they still run the app's own driver and migrator;
      # apps/web/tests/db/neon-sql-shim.test.ts pins its fidelity on real Postgres.
      - name: Start neon-sql shim
        if: steps.dedupe.outputs.redundant != 'true'
        run: |
          nohup bun scripts/ci/neon-sql-shim.ts > "$RUNNER_TEMP/neon-sql-shim.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null -X POST "$NEON_LOCAL_FETCH_ENDPOINT" \
              -H "Neon-Connection-String: $DATABASE_URL" \
              -H 'Neon-Raw-Text-Output: true' -H 'Neon-Array-Mode: true' \
              -H 'Content-Type: application/json' -d '{"query":"select 1","params":[]}' && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/neon-sql-shim.log"
          echo "neon-sql shim never answered" && exit 1
      - name: Migrate
        if: steps.dedupe.outputs.redundant != 'true'
        run: cd packages/core && bun db:migrate
      - name: Run DB architecture tests
        if: steps.dedupe.outputs.redundant != 'true'
        run: bun run test:db
      - name: Shim log
        if: failure() && steps.dedupe.outputs.redundant != 'true'
        run: cat "$RUNNER_TEMP/neon-sql-shim.log" || true

  # Detect which areas changed to skip expensive integration/E2E when unnecessary
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    outputs:
      api: ${{ steps.filter.outputs.api }}
      runner: ${{ steps.filter.outputs.runner }}
      needs_server: ${{ steps.filter.outputs.needs_server }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "Changed files:"
          echo "$CHANGED"

          # API/server changes — triggers integration tests
          API=$(echo "$CHANGED" | grep -qE '^(apps/web/src/|packages/core/|packages/shared/)' && echo "true" || echo "false")

          # Runner changes — triggers E2E tests
          RUNNER=$(echo "$CHANGED" | grep -qE '^(apps/runner/)' && echo "true" || echo "false")

          # Either requires the server infrastructure
          NEEDS_SERVER=$( [[ "$API" == "true" || "$RUNNER" == "true" ]] && echo "true" || echo "false" )

          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"
          echo "needs_server=$NEEDS_SERVER" >> "$GITHUB_OUTPUT"

          echo "::notice::api=$API runner=$RUNNER needs_server=$NEEDS_SERVER"

  # Shared infrastructure: Neon branch + Tailscale + preview server + runner
  # Only spins up when API or runner code changed
  integration:
    needs: changes
    # Skipped on release PRs (dev→main), which flake on CI Claude quota and missing
    # E2E workspace fixtures. Hotfix PRs (feature→main) bypass dev, so they still
    # run it. `build` remains the only required check on main.
    #
    # The dev→main path is covered by post-merge-integration.yml instead: it runs
    # the API integration tests on every push to dev (advisory, never required),
    # and release_status reports that result for the release PR's head. The job
    # body lives in integration.yml so both callers run the same steps.
    if: needs.changes.outputs.needs_server == 'true' && github.head_ref != 'dev'
    uses: ./.github/workflows/integration.yml
    secrets: inherit
    with:
      api: ${{ needs.changes.outputs.api == 'true' }}
      runner: ${{ needs.changes.outputs.runner == 'true' }}
      neon_branch: ci/pr-${{ github.event.pull_request.number }}
