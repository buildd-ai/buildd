name: Worker Image Build Check

# Validates that docker/worker/Dockerfile builds successfully whenever it changes.
# This is a build-only check — it does NOT push the image to a registry.
#
# WHY THIS EXISTS: PR #1545 added the codebase-memory-mcp binary fetch to the
# Dockerfile, but there was no CI step to verify the build, and no pipeline to
# push the resulting image. The binary was therefore never installed on the Coder
# worker image. This workflow catches Dockerfile regressions going forward.
#
# TO ACTUALLY DEPLOY: After merging changes to docker/worker/Dockerfile, rebuild
# the Coder workspace template image manually:
#   docker buildx build --platform linux/amd64,linux/arm64 \
#     -f docker/worker/Dockerfile \
#     -t <registry>/buildd-worker:<tag> \
#     --push .
# Then update the Coder template to use the new image tag.
#
# Until a push pipeline is wired: re-run `install.sh` on each Coder workspace to
# ensure the CBM binary (and any other image-layer tooling) is present.

on:
  push:
    branches: [dev, main]
    paths:
      - 'docker/worker/Dockerfile'
      - 'apps/runner/install.sh'
      - 'scripts/verify-cbm-pin.sh'
      - 'scripts/verify-cbm-grep-steering.ts'
      - '.github/workflows/worker-image.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'docker/worker/Dockerfile'
      - 'apps/runner/install.sh'
      - 'scripts/verify-cbm-pin.sh'
      - 'scripts/verify-cbm-grep-steering.ts'
      - '.github/workflows/worker-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build worker image (linux/amd64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The unit suite has no network, so it can only prove the Dockerfile and
      # install.sh agree with each other. This proves they agree with upstream.
      - name: Verify pinned CBM checksums against upstream release
        run: bash scripts/verify-cbm-pin.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # The pinned binary, fetched exactly as the Dockerfile fetches it (same
      # version ARG, same checksum ARG) so the handshake below interrogates the
      # build the fleet will actually run. No `bun install` needed: the check
      # script has no dependencies outside bun/node builtins.
      - name: Download pinned CBM binary
        run: |
          set -euo pipefail
          version=$(grep -m1 -E '^ARG CBM_VERSION=' docker/worker/Dockerfile | cut -d= -f2)
          sha=$(grep -m1 -E '^ARG CBM_SHA256_AMD64=' docker/worker/Dockerfile | cut -d= -f2)
          curl -fsSL \
            "https://github.com/DeusData/codebase-memory-mcp/releases/download/v${version}/codebase-memory-mcp-linux-amd64.tar.gz" \
            -o /tmp/cbm.tar.gz
          echo "${sha}  /tmp/cbm.tar.gz" | sha256sum -c
          mkdir -p /tmp/cbm-bin
          tar -xzf /tmp/cbm.tar.gz -C /tmp/cbm-bin codebase-memory-mcp
          chmod +x /tmp/cbm-bin/codebase-memory-mcp

      # A version bump that KEEPS the vendor's anti-grep tool descriptions passes;
      # one that strips them fails here, loudly, instead of silently halving
      # buildd's grep steering. This is a property check, not a version ceiling —
      # see the header of the script for the matching rule and its tolerance.
      - name: Verify CBM graph tools still steer away from grep
        env:
          CBM_BINARY: /tmp/cbm-bin/codebase-memory-mcp
        run: bun scripts/verify-cbm-grep-steering.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build worker image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/worker/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            TARGETARCH=amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
