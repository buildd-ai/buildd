name: CI Auto-Fix

on:
  workflow_run:
    workflows: ["Build & Test"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

jobs:
  detect-error-type:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    outputs:
      error_type: ${{ steps.classify.outputs.error_type }}
      is_infrastructure_error: ${{ steps.classify.outputs.is_infrastructure_error }}
      failed_job: ${{ steps.classify.outputs.failed_job }}
      run_id: ${{ steps.classify.outputs.run_id }}
    steps:
      - name: Classify error type
        id: classify
        run: |
          RUN_ID=${{ github.event.workflow_run.id }}
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

          # Get failed job logs with full context (don't truncate)
          LOGS=$(gh run view $RUN_ID --log-failed 2>&1)

          # Detect infrastructure errors that should not trigger code fixes:
          # 1. Test machine unreachable over Tailscale (network/host infra issue)
          # 2. Error message explicitly says to run 'sudo tailscale up --ssh' on host
          if echo "$LOGS" | grep -qE "Test machine.*is unreachable over Tailscale|sudo tailscale up --ssh"; then
            echo "error_type=tailscale_unreachable" >> $GITHUB_OUTPUT
            echo "is_infrastructure_error=true" >> $GITHUB_OUTPUT
            echo "::warning::Infrastructure error detected: test machine unreachable via Tailscale — will auto-retry instead of attempting code fix"
            # Find which job failed (integration is the only one with Tailscale dependency)
            FAILED_JOB=$(gh run view $RUN_ID --json jobs -q '.jobs[] | select(.conclusion=="failure") | .name' | head -1)
            echo "failed_job=$FAILED_JOB" >> $GITHUB_OUTPUT
            echo "Failed job: $FAILED_JOB"
          else
            echo "error_type=code_issue" >> $GITHUB_OUTPUT
            echo "is_infrastructure_error=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  infra-auto-retry:
    runs-on: ubuntu-latest
    needs: detect-error-type
    # run_attempt is the attempt number of the Build & Test run that just completed.
    # Each successful `gh run rerun` bumps it and fires a fresh workflow_run event here,
    # so this is the only thing capping total retries across separate CI-fix invocations
    # (the loop below only bounds retries of the rerun API call itself). Once an outage
    # has survived this many full attempts, infra-retry-exhausted alerts a human instead.
    if: |
      needs.detect-error-type.outputs.is_infrastructure_error == 'true' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.run_attempt < 3 &&
      !contains(github.event.workflow_run.head_commit.message, 'skip-retry:')
    steps:
      - name: Auto-rerun failed jobs with backoff
        run: |
          RUN_ID=${{ needs.detect-error-type.outputs.run_id }}
          FAILED_JOB=${{ needs.detect-error-type.outputs.failed_job }}

          echo "Detected infrastructure error in job: $FAILED_JOB"
          echo "Will attempt to auto-rerun the failed job up to 3 times with backoff."

          # Attempt rerun with exponential backoff
          for attempt in 1 2 3; do
            echo "Rerun attempt $attempt/3..."
            if gh run rerun $RUN_ID --failed 2>&1; then
              echo "✓ Successfully triggered rerun of failed jobs"
              echo "The job will execute again — if it passes, no code change was needed."
              echo "If it fails again with the same error, this indicates a persistent infra issue."
              exit 0
            fi

            if [ $attempt -lt 3 ]; then
              # Exponential backoff: 60s, 120s
              wait_time=$((60 * attempt))
              echo "Rerun trigger failed, waiting ${wait_time}s before next attempt..."
              sleep $wait_time
            else
              echo "❌ Failed to trigger rerun after 3 attempts"
              echo "This is unusual — check GitHub Actions API status"
              exit 1
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}

  infra-retry-exhausted:
    runs-on: ubuntu-latest
    needs: detect-error-type
    if: |
      needs.detect-error-type.outputs.is_infrastructure_error == 'true' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.run_attempt >= 3
    steps:
      - name: Alert a human — infra retries exhausted
        run: |
          RUN_ID=${{ needs.detect-error-type.outputs.run_id }}
          FAILED_JOB="${{ needs.detect-error-type.outputs.failed_job }}"
          echo "::warning::Infrastructure error persisted for ${{ github.event.workflow_run.run_attempt }} attempts on run $RUN_ID (job: $FAILED_JOB) — giving up on auto-retry."

          TITLE="CI infra outage: $FAILED_JOB has failed ${{ github.event.workflow_run.run_attempt }}x on dev (run $RUN_ID)"
          EXISTING=$(gh issue list --state open --search "in:title \"$FAILED_JOB has failed\"" --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still failing after another auto-retry attempt. Run: https://github.com/${{ github.repository }}/actions/runs/$RUN_ID"
          else
            gh issue create --title "$TITLE" \
              --body "Auto-retry gave up after ${{ github.event.workflow_run.run_attempt }} attempts of the same run — this needs a human. Run: https://github.com/${{ github.repository }}/actions/runs/$RUN_ID"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  auto-fix:
    runs-on: ubuntu-latest
    needs: detect-error-type
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'dev' &&
      !contains(github.event.workflow_run.head_commit.message, 'autofix:') &&
      needs.detect-error-type.outputs.is_infrastructure_error == 'false'
    steps:
      # Mint a token for the release App so the autofix push to dev is authored
      # by the App, not the default GITHUB_TOKEN. Pushes made with GITHUB_TOKEN
      # do NOT trigger new workflow runs (GitHub's recursion guard), so the fix
      # would land on dev without re-running Build & Test — leaving any open
      # release PR's required check stuck until a human manually re-runs it.
      # Reuses the same App as release.yml (vars.RELEASE_APP_ID +
      # secrets.RELEASE_APP_PRIVATE_KEY). Absent ⇒ falls back to github.token.
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Get failed job logs
        id: logs
        run: |
          RUN_ID=${{ github.event.workflow_run.id }}
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          LOGS=$(gh run view $RUN_ID --log-failed 2>&1 | tail -100)
          {
            echo 'CI_FAILURE_LOGS<<EOFLOG'
            echo "$LOGS"
            echo 'EOFLOG'
          } >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: anthropics/claude-code-action@v1
        with:
          # This workflow only ever fires from a `dev` push (job-level `if` above),
          # authored by a human or by one of these two known bots — buildd-ai (worker
          # commits) or buildd-release (the release process). A 30-day audit found
          # ~47% of all failures were the action refusing to run at all because its
          # default `allowed_bots: ""` rejects any Bot actor; naming the two bots this
          # repo actually produces (never '*') fixes that without opening the action to
          # an arbitrary external bot on this public repo.
          allowed_bots: "buildd-ai,buildd-release"
          prompt: |
            The CI build failed on the dev branch. Here are the last 100 lines of the failed job logs:

            ```
            ${{ env.CI_FAILURE_LOGS }}
            ```

            Dependencies are already installed. Fix the issue directly:
            1. Read the error messages above to identify the root cause
            2. Fix the source files (the codebase is already checked out)
            3. If schema changed, run: cd packages/core && bun db:generate
            4. Verify your fix: cd apps/web && bunx tsc --noEmit
            5. Commit and push with prefix "autofix:" so this workflow doesn't loop

            IMPORTANT: Do NOT spend turns downloading or re-reading CI logs - they are provided above.
            Use `git push origin dev` to push your fix.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 30 was the other ~47% of failures: of the runs that got past the bot-actor
          # check above and actually succeeded, several finished at 26-28/30 turns —
          # the cap was already close to binding on a WORKING fix, so on a harder one
          # it was undersized rather than a genuine "this is unfixable" signal. 50 gives
          # real headroom without being unbounded.
          claude_args: '--max-turns 50 --allowedTools "Bash(*),Edit,Read,Write,Glob,Grep"'
