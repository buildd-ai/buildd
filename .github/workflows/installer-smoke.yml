name: Installer Smoke

# Runs the REAL one-line installer (`curl … install.sh | bash`) from the commit
# under test, in a clean ubuntu container, as a non-root user with no sudo and an
# empty HOME — then checks `buildd --version` and that a started runner answers
# /health. Every unit test of install.sh greps its text; none of them ever ran
# it, which is how a sparse checkout missing a workspace package shipped and
# broke every new user's install. fresh-install-windows does the same for
# install.ps1 (`irm … | iex`) on windows-latest.
#
# Path filter: anything the sparse install tree contains or resolves at runtime.

on:
  push:
    branches: [dev, main]
    paths:
      - 'apps/runner/**'
      - 'packages/core/**'
      - 'packages/shared/**'
      - 'packages/ai-kit/**'
      - 'packages/dispatch-contract/**'
      - 'packages/spec-contract/**'
      - 'scripts/stub-server-only.ts'
      - 'scripts/ci/apt-install.sh'
      - 'bunfig.toml'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/installer-smoke.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'apps/runner/**'
      - 'packages/core/**'
      - 'packages/shared/**'
      - 'packages/ai-kit/**'
      - 'packages/dispatch-contract/**'
      - 'packages/spec-contract/**'
      - 'scripts/stub-server-only.ts'
      - 'scripts/ci/apt-install.sh'
      - 'bunfig.toml'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/installer-smoke.yml'
  workflow_dispatch:

concurrency:
  group: installer-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fresh-install:
    name: Fresh install (ubuntu, non-root, no sudo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The runner pulls a job container before any step runs, so no step can
    # retry it or fall back. Docker Hub rate-limits shared runner IPs and ECR
    # Public hit its data limit (2026-10-14/15), so this is the official image
    # copied into our GHCR mirror (mirror-ci-images.yml), pulled with GITHUB_TOKEN.
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/buildd-ai/ci-mirror/ubuntu:26.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      # Before git exists, so checkout downloads the tree over the REST API; the
      # installer clones the commit under test itself and never needs .git here.
      - uses: actions/checkout@v7

      # Retries and falls back to another Ubuntu mirror: archive.ubuntu.com
      # being unreachable from the runner once turned dev red (2026-10-22).
      - name: Base tools a fresh machine has
        run: |
          bash scripts/ci/apt-install.sh curl git unzip ca-certificates procps
          useradd -m -s /bin/bash stranger

      - name: Install from this commit and start the runner
        env:
          # The installer is fetched and cloned at the exact commit under test.
          BUILDD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILDD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          cp apps/runner/scripts/installer-smoke.sh /tmp/installer-smoke.sh
          chmod 755 /tmp/installer-smoke.sh
          su stranger -s /bin/bash -c "BUILDD_REF='$BUILDD_REF' BUILDD_REPO='$BUILDD_REPO' bash /tmp/installer-smoke.sh"

  fresh-install-client:
    name: Fresh install --client (ubuntu, non-root, no sudo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The runner pulls a job container before any step runs, so no step can
    # retry it or fall back. Docker Hub rate-limits shared runner IPs and ECR
    # Public hit its data limit (2026-10-14/15), so this is the official image
    # copied into our GHCR mirror (mirror-ci-images.yml), pulled with GITHUB_TOKEN.
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/buildd-ai/ci-mirror/ubuntu:26.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      # Before git exists, so checkout downloads the tree over the REST API; the
      # installer clones the commit under test itself and never needs .git here.
      - uses: actions/checkout@v7

      # Retries and falls back to another Ubuntu mirror: archive.ubuntu.com
      # being unreachable from the runner once turned dev red (2026-10-22).
      - name: Base tools a fresh machine has
        run: |
          bash scripts/ci/apt-install.sh curl git unzip ca-certificates procps
          useradd -m -s /bin/bash stranger

      - name: Client install, then upgrade to the full runner, then --client over it
        env:
          BUILDD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILDD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          cp apps/runner/scripts/installer-smoke-client.sh /tmp/installer-smoke-client.sh
          chmod 755 /tmp/installer-smoke-client.sh
          su stranger -s /bin/bash -c "BUILDD_REF='$BUILDD_REF' BUILDD_REPO='$BUILDD_REPO' bash /tmp/installer-smoke-client.sh"

  fresh-install-windows:
    name: Fresh install (windows, install.ps1)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The same `irm .../install.ps1 | iex` the docs give, from the commit under
      # test, then --version, help, status and init through the generated
      # buildd.cmd: the launcher once rejected status/logout/init as unknown
      # arguments and only a real Windows machine noticed.
      - name: Install from this commit and drive buildd.cmd
        shell: powershell
        env:
          BUILDD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILDD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: powershell -NoProfile -ExecutionPolicy ByPass -File apps/runner/scripts/installer-smoke.ps1
