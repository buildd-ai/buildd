name: Integration

# The integration + E2E job, callable from more than one trigger:
#   - build.yml `integration`: PRs into main whose head is not dev (hotfixes).
#     Check name "integration / integration".
#   - post-merge-integration.yml: every push to dev, API tests only, advisory.
#     Check name "post-merge integration / integration". The release gate
#     (apps/web/src/lib/release/dispatch.ts) excludes that prefix from ciState.
# Neither check is required on main (only `build` is).

on:
  workflow_call:
    inputs:
      api:
        description: Run the API integration tests
        type: boolean
        required: true
      runner:
        description: Start the preview runner (runner code changed)
        type: boolean
        required: true
      e2e:
        description: Run the E2E suite after the integration tests
        type: boolean
        default: true
      neon_branch:
        description: Name of the throwaway Neon branch for this run
        type: string
        required: true
      checkout_sha:
        description: Exact commit to test on the test machine (empty = branch head)
        type: string
        default: ''

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    # One test machine, one fixed checkout path, one server port, one set of
    # screen sessions: two runs at once overwrite each other. Every caller (the
    # hotfix-PR path in build.yml, post-merge-integration.yml on dev) shares
    # this group. A running job is never cancelled; GitHub keeps one pending
    # job per group, so a newer queued run replaces an older queued one.
    concurrency:
      group: integration-test-machine
      cancel-in-progress: false

    # Test-machine coordinates. Repo variables, not literals: this repo is public.
    # Unset TEST_HOST/TEST_CONTAINER makes the sync step skip loudly (see below).
    env:
      TEST_HOST: ${{ vars.TEST_MACHINE_HOST }}
      TEST_USER: ${{ vars.TEST_MACHINE_USER || 'ubuntu' }}
      TEST_CONTAINER: ${{ vars.TEST_MACHINE_CONTAINER }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install

      - name: Create Neon preview branch
        id: neon
        run: |
          BRANCH_NAME="${{ inputs.neon_branch }}"

          # Check if branch already exists
          EXISTING=$(curl -sf \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches" \
            | jq -r --arg name "$BRANCH_NAME" '.branches[] | select(.name == $name) | .id')

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "Deleting stale Neon branch: $EXISTING"
            curl -sf -X DELETE \
              -H "Authorization: Bearer $NEON_API_KEY" \
              "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$EXISTING" || true
            sleep 2
          fi

          echo "Creating Neon branch: $BRANCH_NAME"
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"branch\": {\"name\": \"$BRANCH_NAME\", \"parent_id\": \"$NEON_PARENT_BRANCH_ID\"}, \"endpoints\": [{\"type\": \"read_write\"}]}" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches")
          BRANCH_ID=$(echo "$RESPONSE" | jq -r '.branch.id')
          if [ "$BRANCH_ID" = "null" ] || [ -z "$BRANCH_ID" ]; then
            echo "::error::Failed to create Neon branch"
            echo "$RESPONSE" | jq .
            exit 1
          fi

          # Extract connection URI directly from the API response — avoids static
          # password secrets that may not match the new branch endpoint immediately.
          CONNECTION_URI=$(echo "$RESPONSE" | jq -r '.connection_uris[0].connection_uri // empty')

          if [ -z "$CONNECTION_URI" ]; then
            echo "::warning::connection_uris not in branch response, fetching connection string via endpoint API"
            ENDPOINT_ID=$(echo "$RESPONSE" | jq -r '.endpoints[0].id // empty')
            if [ -n "$ENDPOINT_ID" ]; then
              # Get connection URI from the endpoint's connection_uri API. The endpoint can
              # still be provisioning right after branch creation, so a non-2xx response here
              # is expected — log the status for diagnostics, then fall through to the
              # manual-construction fallback below instead.
              # Note: role_name is required by the endpoint to resolve the connection URI.
              CONN_RESPONSE=$(curl -s -w "\n%{http_code}" \
                -H "Authorization: Bearer $NEON_API_KEY" \
                "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/connection_uri?branch_id=$BRANCH_ID&endpoint_id=$ENDPOINT_ID&database_name=neondb&role_name=$NEON_DB_USER" || true)
              HTTP_CODE=$(echo "$CONN_RESPONSE" | tail -1)
              CONN_BODY=$(echo "$CONN_RESPONSE" | head -n -1)
              if [ "$HTTP_CODE" != "200" ] && [ -n "$HTTP_CODE" ]; then
                echo "::warning::connection_uri request failed with HTTP status $HTTP_CODE"
                MSG=$(echo "$CONN_BODY" | jq -r '.message // empty' 2>/dev/null)
                [ -n "$MSG" ] && echo "  Error details: $MSG"
              else
                CONNECTION_URI=$(echo "$CONN_BODY" | jq -r '.uri // empty' 2>/dev/null || true)
              fi
            fi
          fi

          if [ -z "$CONNECTION_URI" ]; then
            echo "::warning::Could not extract connection URI from API, falling back to manual construction"
            ENDPOINTS=$(curl -sf \
              -H "Authorization: Bearer $NEON_API_KEY" \
              "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID/endpoints" || true)
            HOST=$(echo "$ENDPOINTS" | jq -r '.endpoints[0].host // empty' 2>/dev/null || true)
            if [ -z "$HOST" ]; then
              echo "::error::Could not determine Neon endpoint host for branch $BRANCH_ID"
              exit 1
            fi
            CONNECTION_URI="postgresql://${NEON_DB_USER}:${NEON_DB_PASSWORD}@${HOST}/neondb?sslmode=require"
          fi

          # Ensure sslmode=require is present
          if [[ "$CONNECTION_URI" != *"sslmode=require"* ]]; then
            if [[ "$CONNECTION_URI" == *"?"* ]]; then
              CONNECTION_URI="${CONNECTION_URI}&sslmode=require"
            else
              CONNECTION_URI="${CONNECTION_URI}?sslmode=require"
            fi
          fi

          echo "branch_id=$BRANCH_ID" >> "$GITHUB_OUTPUT"
          echo "database_url=$CONNECTION_URI" >> "$GITHUB_OUTPUT"
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH_ID: ${{ secrets.NEON_PARENT_BRANCH_ID }}
          NEON_DB_USER: ${{ secrets.NEON_DB_USER }}
          NEON_DB_PASSWORD: ${{ secrets.NEON_DB_PASSWORD }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Sync code and build on test machine
        id: sync
        env:
          # Empty on the PR path (the branch head is what's under test). Set on
          # the post-merge path: dev may have moved on by the time this job
          # leaves the queue, and the result is reported against this SHA.
          CHECKOUT_SHA: ${{ inputs.checkout_sha }}
        run: |
          # Print what we resolved before using it. A gate that reports only
          # pass/fail cannot distinguish "healthy" from "never ran".
          if [ -z "$TEST_HOST" ] || [ -z "$TEST_CONTAINER" ]; then
            # Fails for the same reason the unreachable branch below does: no
            # tests ran, so this must not report as passing coverage. Not a
            # required check on `main`, so it annotates without blocking.
            echo "::error::Test machine not configured, so NO integration or E2E tests ran. Set the repo variables: gh variable set TEST_MACHINE_HOST --body '<tailscale-host>'; gh variable set TEST_MACHINE_CONTAINER --body '<container>'"
            echo "INTEGRATION_MODE=skipped_unconfigured"
            echo "machine_online=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "INTEGRATION_MODE=full host=$TEST_HOST container=$TEST_CONTAINER user=$TEST_USER"
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          rc=1
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt/5: syncing and building on test machine..."
            if tailscale ssh "$TEST_USER@$TEST_HOST" << SCRIPT
              docker exec $TEST_CONTAINER bash -c "
                set -e
                export PATH=/home/coder/.local/bin:/home/coder/.bun/bin:\\\$PATH
                (chmod -R u+rwx /tmp/buildd-ci 2>/dev/null || true) && rm -rf /tmp/buildd-ci
                git clone --depth 1 --branch $BRANCH https://github.com/${{ github.repository }}.git /tmp/buildd-ci
                if [ -n '$CHECKOUT_SHA' ]; then git -C /tmp/buildd-ci fetch --depth 1 origin $CHECKOUT_SHA && git -C /tmp/buildd-ci checkout -q FETCH_HEAD; fi
                cd /tmp/buildd-ci && bun install 2>&1 | tail -3
                cd apps/web && DATABASE_URL=postgresql://x:x@localhost/x AUTH_SECRET=build-secret bun run build:only 2>&1 | tail -50
                test -d .next || { echo 'Build failed: .next directory missing'; exit 1; }
              "
          SCRIPT
            then
              rc=0
              break
            fi
            [ $attempt -lt 5 ] && echo "Attempt $attempt failed, retrying in 60s..." && sleep 60
          done
          if [ $rc -ne 0 ]; then
            echo "All SSH attempts failed. Probing Tailscale connectivity..."
            if timeout 15 tailscale ping "$TEST_HOST" 2>&1 | grep -qi "pong"; then
              echo "::error::SSH failed but machine IS reachable via Tailscale — check SSH/docker config on the test machine"
              echo "machine_online=true" >> "$GITHUB_OUTPUT"
              exit 1
            else
              # FAILS, deliberately. This branch used to `exit 0` with a warning,
              # on the reasoning that an infra outage is not a code problem. The
              # consequence: between 2026-07-16 and 2026-08-29 this job reported
              # SUCCESS six consecutive times having executed zero tests, because
              # Tailscale was logged out on the host the whole time. A green that
              # cannot be told apart from "never ran" is worse than a red one.
              #
              # Safe to fail: `integration` is NOT a required check on `main`
              # (only `build` is), so a red here annotates the run without
              # blocking a merge — including the hotfix PRs that are this job's
              # entire population.
              #
              # NOTE: ci-fix.yml detects this error message pattern and handles
              # infrastructure failures specially: instead of attempting a code
              # fix (which cannot succeed), it auto-reruns the failed job up to
              # 3 times with backoff. This gives transient Tailscale outages a
              # chance to clear without creating unnecessary CI-retry tasks. If
              # the job persistently fails with this error after 3 reruns, a
              # human must run 'sudo tailscale up --ssh' on the host.
              echo "::error::Test machine ${TEST_HOST} is unreachable over Tailscale, so NO integration or E2E tests ran. This is an infrastructure failure, not a code failure — but it is reported as a failure so it cannot masquerade as passing coverage. Fix: run 'sudo tailscale up --ssh' on the host (it logs out and stays out), then re-run this job."
              echo "INTEGRATION_MODE=skipped_unreachable"
              echo "machine_online=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          echo "machine_online=true" >> "$GITHUB_OUTPUT"

      - name: Verify SDK native binary (post-build)
        if: steps.sync.outputs.machine_online != 'false'
        # The integration tests have repeatedly failed with
        # "Claude Code native binary not found at /tmp/buildd-ci/node_modules/.bun/
        # @anthropic-ai+claude-agent-sdk-linux-arm64-musl@<ver>/.../claude" even
        # though manual reproduction shows the binary lands fine. This step
        # captures the state of the SDK's platform packages right after install
        # so we can tell whether the binary went missing, was never installed,
        # or has the wrong executable bit. Compare with the on-failure dump below.
        #
        # We avoid nested heredocs over tailscale ssh — the outer heredoc is
        # consumed as ssh stdin, leaving none for the inner one. Use bash -c
        # with the script piped via stdin to docker exec -i instead.
        run: |
          tailscale ssh "$TEST_USER@$TEST_HOST" "docker exec -i $TEST_CONTAINER bash -s" << 'INNER' || true
          set +e
          echo "::group::SDK binary state (post-build)"
          echo "--- arch + bun version ---"
          uname -m
          /home/coder/.bun/bin/bun --version
          echo "--- expected platform variant present? ---"
          ls -la /tmp/buildd-ci/node_modules/.bun/@anthropic-ai+claude-agent-sdk-linux-arm64-musl@*/node_modules/@anthropic-ai/claude-agent-sdk-linux-arm64-musl/claude 2>&1 | head -5
          echo "--- parent SDK's symlink to platform variant ---"
          ls -la /tmp/buildd-ci/node_modules/.bun/@anthropic-ai+claude-agent-sdk@*/node_modules/@anthropic-ai/ 2>&1 | head -10
          echo "--- top-level @anthropic-ai (should NOT exist with isolated linker) ---"
          ls -la /tmp/buildd-ci/node_modules/@anthropic-ai/ 2>&1 | head -10
          echo "--- all .bun anthropic-ai entries ---"
          ls /tmp/buildd-ci/node_modules/.bun/ 2>&1 | grep '@anthropic-ai' | head -10
          echo "--- bun pm ls (claude-agent-sdk only) ---"
          cd /tmp/buildd-ci && /home/coder/.bun/bin/bun pm ls 2>&1 | grep -i 'claude-agent-sdk' | head -10
          echo "::endgroup::"
          INNER

      - name: Run migrations on Neon preview branch
        if: steps.sync.outputs.machine_online != 'false'
        run: cd packages/core && bun db:migrate
        env:
          DATABASE_URL: ${{ steps.neon.outputs.database_url }}

      - name: Raise concurrency limits for CI
        if: steps.sync.outputs.machine_online != 'false'
        run: |
          psql "$DATABASE_URL" <<'SQL'
            UPDATE accounts SET max_concurrent_workers = 50;
            UPDATE worker_heartbeats SET max_concurrent_workers = 50;
          SQL
        env:
          DATABASE_URL: ${{ steps.neon.outputs.database_url }}

      - name: Start preview server
        if: steps.sync.outputs.machine_online != 'false'
        run: |
          # Pipe env vars to a file on the remote — avoids all escaping issues
          printf 'DATABASE_URL=%s\nAUTH_SECRET=%s\n' "$DATABASE_URL" "$AUTH_SECRET" | \
            tailscale ssh "$TEST_USER@$TEST_HOST" \
              "docker exec -i $TEST_CONTAINER bash -c 'cat > /tmp/buildd-ci/.env.test'"

          # Start Next.js server with real env vars
          tailscale ssh "$TEST_USER@$TEST_HOST" << 'SCRIPT'
            docker exec ${{ vars.TEST_MACHINE_CONTAINER }} bash -c '
              export PATH=$HOME/.local/bin:$HOME/.bun/bin:$PATH
              screen -X -S buildd-web quit 2>/dev/null || true
              screen -dmS buildd-web bash -c "
                export PATH=\$HOME/.local/bin:\$HOME/.bun/bin:\$PATH
                set -a; source /tmp/buildd-ci/.env.test; set +a
                export PORT=3333
                cd /tmp/buildd-ci/apps/web && bun run start >> /tmp/buildd-web.log 2>&1
              "
            '
          SCRIPT

          # Wait for server
          for i in $(seq 1 30); do
            if curl -s http://${{ vars.TEST_MACHINE_HOST }}:3333/api/version 2>/dev/null | jq -e . >/dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Preview server failed to start after 150s"
              echo "--- /tmp/buildd-web.log ---"
              tailscale ssh "$TEST_USER@$TEST_HOST" \
                "docker exec $TEST_CONTAINER cat /tmp/buildd-web.log 2>/dev/null" || true
              exit 1
            fi
            echo "Waiting for server... (attempt $i)"
            sleep 5
          done
        env:
          DATABASE_URL: ${{ steps.neon.outputs.database_url }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      - name: Verify SDK native binary (pre-runner)
        if: steps.sync.outputs.machine_online != 'false' && inputs.runner
        # Same probe as post-build, but right before the runner spawns. If the
        # binary is here then but the runner reports it missing, the issue is
        # in how the runner process resolves the path, not in the install.
        run: |
          tailscale ssh "$TEST_USER@$TEST_HOST" "docker exec -i $TEST_CONTAINER bash -s" << 'INNER' || true
          echo "::group::SDK binary state (pre-runner)"
          ls -la /tmp/buildd-ci/node_modules/.bun/@anthropic-ai+claude-agent-sdk-linux-arm64-musl@*/node_modules/@anthropic-ai/claude-agent-sdk-linux-arm64-musl/claude 2>&1 | head -3
          ls -la /tmp/buildd-ci/node_modules/.bun/@anthropic-ai+claude-agent-sdk@*/node_modules/@anthropic-ai/claude-agent-sdk-linux-arm64-musl 2>&1 | head -3
          echo "::endgroup::"
          INNER

      - name: Generate runner local token
        # The runner's local server binds to loopback and requires a local token
        # by default. The tests below drive it from this job over the tailnet, so
        # the runner is started with an explicit bind and a per-run token.
        if: steps.sync.outputs.machine_online != 'false'
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "BUILDD_LOCAL_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Start preview runner
        if: steps.sync.outputs.machine_online != 'false' && inputs.runner
        run: |
          tailscale ssh "$TEST_USER@$TEST_HOST" << SCRIPT
            docker exec $TEST_CONTAINER bash -c "
              export PATH=\\\$HOME/.local/bin:\\\$HOME/.bun/bin:\\\$PATH
              screen -X -S buildd-test quit 2>/dev/null || true
              screen -dmS buildd-test bash -c '
                export PATH=\\\$HOME/.local/bin:\\\$HOME/.bun/bin:\\\$PATH
                export PORT=8767
                export BUILDD_UI_BIND=0.0.0.0
                export LOCAL_UI_URL=http://$TEST_MACHINE_HOST:8767
                export BUILDD_LOCAL_TOKEN=$BUILDD_LOCAL_TOKEN
                export BUILDD_API_KEY=$BUILDD_API_KEY
                export BUILDD_SERVER=http://localhost:3333
                cd /tmp/buildd-ci && bun run apps/runner/src/index.ts >> /tmp/buildd-test.log 2>&1
              '
            "
          SCRIPT
          sleep 5
        env:
          BUILDD_API_KEY: ${{ secrets.BUILDD_API_KEY }}
          # The runner only answers requests whose Host is one of its own
          # addresses; the tests below reach it under this name.
          TEST_MACHINE_HOST: ${{ vars.TEST_MACHINE_HOST }}

      - name: Integration tests
        if: steps.sync.outputs.machine_online != 'false' && inputs.api
        run: |
          bun test apps/web/tests/integration/concurrency.test.ts \
               apps/web/tests/integration/worker-state-machine.test.ts \
               apps/web/tests/integration/schedule-triggers.test.ts \
               apps/web/tests/integration/artifacts.test.ts \
               apps/web/tests/integration/missions-smoke.test.ts \
               apps/runner/__tests__/integration-config.test.ts
        env:
          BUILDD_TEST_SERVER: http://${{ vars.TEST_MACHINE_HOST }}:3333
          BUILDD_API_KEY: ${{ secrets.BUILDD_API_KEY }}
          BUILDD_ADMIN_API_KEY: ${{ secrets.BUILDD_ADMIN_API_KEY }}
          LOCAL_UI_URL: http://${{ vars.TEST_MACHINE_HOST }}:8767

      - name: E2E tests
        if: steps.sync.outputs.machine_online != 'false' && inputs.e2e
        run: |
          set +e
          bun test tests/e2e/server-worker-flow.test.ts
          code=$?
          if [ $code -eq 75 ]; then
            echo "::warning::E2E skipped — CI Claude OAuth quota exhausted (exit 75, EX_TEMPFAIL)"
            exit 0
          fi
          exit $code
        timeout-minutes: 10
        env:
          BUILDD_TEST_SERVER: http://${{ vars.TEST_MACHINE_HOST }}:3333
          BUILDD_RUNNER_SERVER: http://localhost:3333
          BUILDD_API_KEY: ${{ secrets.BUILDD_API_KEY }}
          BUILDD_ADMIN_API_KEY: ${{ secrets.BUILDD_ADMIN_API_KEY }}
          LOCAL_UI_URL: http://${{ vars.TEST_MACHINE_HOST }}:8767
          SKIP_LOCAL_UI_START: "1"
          # Scope E2E tests based on what changed:
          #   api only    → run API tests (fast, no runner needed)
          #   runner only → run all (worker tests need API too)
          #   both        → run all
          E2E_SCOPE: ${{ inputs.runner && 'all' || 'api' }}

      - name: Dump SDK binary state on failure
        if: failure()
        # Compare with the post-build/pre-runner probes — if the binary was
        # there earlier and isn't now, something between those checkpoints
        # mutated /tmp/buildd-ci. Also captures inode/mtime so we can tell
        # whether the file was overwritten vs deleted vs never installed.
        run: |
          tailscale ssh "$TEST_USER@$TEST_HOST" "docker exec -i $TEST_CONTAINER bash -s" << 'INNER' || true
          echo "::group::SDK binary state (on failure)"
          echo "--- expected platform variant ---"
          ls -lai /tmp/buildd-ci/node_modules/.bun/@anthropic-ai+claude-agent-sdk-linux-arm64-musl@*/node_modules/@anthropic-ai/claude-agent-sdk-linux-arm64-musl/claude 2>&1 | head -3
          echo "--- parent SDK's symlink ---"
          ls -la /tmp/buildd-ci/node_modules/.bun/@anthropic-ai+claude-agent-sdk@*/node_modules/@anthropic-ai/ 2>&1 | head -10
          echo "--- exact path from error message ---"
          find /tmp/buildd-ci/node_modules -path '*claude-agent-sdk-linux-arm64-musl*' -maxdepth 6 2>/dev/null | head -10
          echo "--- bun pm ls (claude-agent-sdk only) ---"
          cd /tmp/buildd-ci && /home/coder/.bun/bin/bun pm ls 2>&1 | grep -i 'claude-agent-sdk' | head -10
          echo "--- /tmp/buildd-ci size + free space ---"
          du -sh /tmp/buildd-ci 2>&1 | head -1
          df -h /tmp 2>&1 | tail -1
          echo "::endgroup::"
          INNER

      - name: Dump runner and server logs on failure
        if: failure()
        run: |
          echo "--- /tmp/buildd-test.log (runner) ---"
          tailscale ssh "$TEST_USER@$TEST_HOST" \
            "docker exec $TEST_CONTAINER bash -c 'tail -500 /tmp/buildd-test.log 2>/dev/null'" || echo "(no runner log)"
          echo ""
          echo "--- /tmp/buildd-web.log (server, tail) ---"
          tailscale ssh "$TEST_USER@$TEST_HOST" \
            "docker exec $TEST_CONTAINER bash -c 'tail -200 /tmp/buildd-web.log 2>/dev/null'" || echo "(no server log)"

      - name: Cleanup
        if: always()
        run: |
          tailscale ssh "$TEST_USER@$TEST_HOST" 'docker exec ${{ vars.TEST_MACHINE_CONTAINER }} bash -c "
            screen -X -S buildd-web quit 2>/dev/null
            screen -X -S buildd-test quit 2>/dev/null
            (chmod -R u+rwx /tmp/buildd-ci 2>/dev/null || true) && rm -rf /tmp/buildd-ci
          "' || true

      - name: Cleanup Neon branch
        if: always()
        run: |
          BRANCH_ID="${{ steps.neon.outputs.branch_id }}"
          [ -z "$BRANCH_ID" ] && exit 0
          curl -sf -X DELETE \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID" || true
          echo "Deleted Neon branch: $BRANCH_ID"
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
