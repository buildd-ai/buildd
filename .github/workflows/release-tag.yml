name: Tag Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.title, 'Release v') ||
       startsWith(github.event.pull_request.title, 'Hotfix v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Extract version and tag
        id: version
        run: |
          VERSION=$(echo "${{ github.event.pull_request.title }}" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
          echo "Tagging ${VERSION}"
          git tag "$VERSION"
          git push origin "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Get the previous tag to generate changelog
          PREV_TAG=$(git tag --sort=-v:refname --list 'v*' | grep -v "^${VERSION}$" | head -1)

          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..${VERSION}" --format='- %s' --no-merges | grep -v 'chore: bump version')
          else
            NOTES="Initial release"
          fi

          if [ -z "$NOTES" ]; then
            NOTES="See [PR #${PR_NUMBER}](https://github.com/${{ github.repository }}/pull/${PR_NUMBER}) for details."
          fi

          gh release create "$VERSION" --title "$VERSION" --notes "$NOTES"

      - name: Verify CHANGELOG promotion
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SEMVER="${VERSION#v}"

          # Confirm a versioned section exists for this release
          if ! grep -q "^## \[${SEMVER}\]" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md is missing a [${SEMVER}] section. The promotion step did not run or the version mismatch. Run scripts/release.sh locally or re-trigger a release to fix."
          fi

          # Warn if [Unreleased] still has bullet entries (stuck items)
          UNRELEASED_ENTRIES=$(awk '/^## \[Unreleased\]/{f=1;next} f && /^## \[/{exit} f && /^- /{print}' CHANGELOG.md | wc -l)
          if [ "$UNRELEASED_ENTRIES" -gt 0 ]; then
            echo "::warning::CHANGELOG.md [Unreleased] still has ${UNRELEASED_ENTRIES} entries after releasing ${VERSION}. These were added after the release PR was opened. They will be included in the next release."
          fi

          echo "CHANGELOG verification complete."
